function showTutorial(){TUT_STEP=0;renderTut();document.getElementById('tut').classList.add('on');histSync()}
function closeTutorial(){document.getElementById('tut').classList.remove('on');localStorage.setItem('sori_tut','1');histSync()}

function renderTut(){
  var t=TUT_DATA[TUT_STEP],total=TUT_DATA.length;
  var dots='';for(var i=0;i<total;i++)dots+='<div class="tut-dot'+(i===TUT_STEP?' on':'')+'"></div>';
  var isLast=TUT_STEP===total-1;
  var isFirst=TUT_STEP===0;
  var btns='';
  if(isFirst){
    btns='<div class="tut-btns"><button class="btn btn-y" onclick="tutNext()" style="flex:1">다음</button></div>';
  }else if(isLast){
    btns='<div class="tut-btns"><button class="btn btn-d" onclick="tutPrev()">이전</button><button class="btn btn-y" onclick="closeTutorial()" style="flex:1">시작하기!</button></div>';
  }else{
    btns='<div class="tut-btns"><button class="btn btn-d" onclick="tutPrev()">이전</button><button class="btn btn-y" onclick="tutNext()" style="flex:1">다음</button></div>';
  }
  document.getElementById('tutBox').innerHTML=
    '<div class="tut-emoji">'+t.emoji+'</div>'+
    '<div class="tut-step">'+t.step+'</div>'+
    '<div class="tut-title">'+t.title+'</div>'+
    '<div class="tut-desc">'+t.desc.replace(/\n/g,'<br>')+'</div>'+
    '<div class="tut-example"><div class="tut-example-label">'+t.exLabel+'</div><div class="tut-example-text">'+t.exText+'</div></div>'+
    '<div class="tut-dots">'+dots+'</div>'+btns+
    '<div class="tut-skip" onclick="closeTutorial()">다시 보지 않기</div>';
}
function tutNext(){if(TUT_STEP<TUT_DATA.length-1){TUT_STEP++;renderTut();tutAnimate('left')}}
function tutPrev(){if(TUT_STEP>0){TUT_STEP--;renderTut();tutAnimate('right')}}
function tutAnimate(dir){
  var box=document.getElementById('tutBox');
  box.classList.remove('tut-slide-left','tut-slide-right');
  void box.offsetWidth;
  box.classList.add(dir==='left'?'tut-slide-left':'tut-slide-right');
}

// Tutorial swipe
var tutTouchX=0;
document.getElementById('tut').addEventListener('touchstart',function(e){tutTouchX=e.touches[0].clientX},{passive:true});
document.getElementById('tut').addEventListener('touchend',function(e){
  var diff=e.changedTouches[0].clientX-tutTouchX;
  if(Math.abs(diff)>50){
    if(diff<0)tutNext();
    else tutPrev();
  }
},{passive:true});

function checkFirstRun(){
  if(!localStorage.getItem('sori_tut'))showTutorial();
}

// ═══ 수납 현황표 (종이 양식) ═══
// 기본은 전월·이번 달 두 칸. 월 제목(또는 "6개월 보기")을 누르면 6개월로 펼쳐진다.
// 칸을 누르면 납부일·메모 창이 뜨고, 저장을 눌러야 기록된다. 이름 줄을 누르면 원생 정보 수정.
var LDG={y:new Date().getFullYear(),m:new Date().getMonth()+1,wide:false,Y:{},at:{},busy:{},rows:[],saving:{},ver:{},swiped:0,lastDate:'',err:'',anim:'',pop:''};
var RET=[]; // 퇴원 원생 (복원용)
var LDG_METHODS=['카드','현금','앱','현영','계좌'];

function ldgCacheKey(y){return 'sori_ldg2_'+(IS_TEST?'t':'m')+'_'+y}
function ldgReadCache(y){try{var v=localStorage.getItem(ldgCacheKey(y));return v?JSON.parse(v):null}catch(e){return null}}
function ldgWriteCache(y){try{if(LDG.Y[y])localStorage.setItem(ldgCacheKey(y),JSON.stringify(LDG.Y[y]))}catch(e){}}
function ldgToday(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function ldgShortDate(s){var m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s||'');return m?(+m[2])+'/'+(+m[3]):esc(s||'')}
function ldgFee(s){var t=String(s||'').trim();if(/^[\d,]+$/.test(t)){var n=parseInt(t.replace(/,/g,''),10);return isNaN(n)?t:n.toLocaleString()}return t}
function ldgFreq(f){f=String(f||'').trim();return /^\d+$/.test(f)?'주'+f+'회':f}
function ldgPrev(y,m){return m>1?{y:y,m:m-1}:{y:y-1,m:12}}
function ldgNext(y,m){return m<12?{y:y,m:m+1}:{y:y+1,m:1}}
// 화면에 보이는 달들 (왼쪽이 옛날). 맨 오른쪽이 LDG.y/LDG.m
function ldgCols(){var n=LDG.wide?6:2,a=[],c={y:LDG.y,m:LDG.m};for(var k=0;k<n;k++){a.unshift(c);c=ldgPrev(c.y,c.m)}return a}
function ldgYears(){var a=[];ldgCols().forEach(function(c){if(a.indexOf(c.y)<0)a.push(c.y)});return a}
function ldgStu(y,name){var d=LDG.Y[y];if(!d)return null;for(var i=0;i<d.students.length;i++)if(d.students[i].name===name)return d.students[i];return null}
function ldgCell(y,m,name){var s=ldgStu(y,name);return s?s.months[m]:null}
function ldgKey(name,y,m){return name+'|'+y+'|'+m}
// 미납 색 단계. 그 달 수강료는 보통 전달 말~그 달 초에 받는다 (종이 장부 기준)
// 그 달 5일까지는 0(색 없음) → 6일부터 1(연노랑) → 16일부터 2(연주황) → 달이 넘어가면 3(연빨강)
// 앱으로 기록을 시작한 2026년 10월보다 앞선 달은 칠하지 않는다
var LDG_DUE_FROM=2026*12+10;
function ldgDue(y,m){
  var n=new Date(),d=n.getFullYear()*12+n.getMonth()+1-(y*12+m);
  if(y*12+m<LDG_DUE_FROM||d<0)return 0;
  if(d>0)return 3;
  return n.getDate()>15?2:n.getDate()>5?1:0;
}

function switchTab(t){
  if(t==='ledger'){if(VIEW!=='ledger')ldgOpen()}
  else if(t==='stu'){if(VIEW!=='students')rStudents()}
  else if(VIEW!=='input')rInput();
}

function ldgOpen(){LDG.pct=0;LDG.sel=null;setView('ledger');ldgLoad()}

// 폰에 저장된 표를 먼저 보여주고, 뒤에서 최신 내용을 받아 바꾼다 (1년치 = 요청 1번)
// 표는 기다리지 않고 바로 그린다. 아직 못 받은 해의 칸만 "받는 중"으로 두고, 도착하면 채운다.
function ldgLoad(force){
  var ys=ldgYears();
  function cache(y){if(!LDG.Y[y]){var c=ldgReadCache(y);if(c&&c.students)LDG.Y[y]=c}}
  ys.forEach(cache);
  LDG.err='';
  ldgRender();
  ys.forEach(function(y){if(force||!LDG.at[y]||Date.now()-LDG.at[y]>=60000)ldgFetchYear(y)});
  // 앞뒤 해를 미리 받아 둔다 → 달을 넘기다 해가 바뀌어도 기다리지 않게
  clearTimeout(LDG.preTm);
  LDG.preTm=setTimeout(function(){
    [ys[0]-1,ys[ys.length-1]+1].forEach(function(y){cache(y);if(!LDG.Y[y]&&!LDG.at[y])ldgFetchYear(y)});
  },1200);
}
function ldgFetchYear(y){
  if(LDG.busy[y])return;
  LDG.busy[y]=true;
  var gen=STU_GEN;
  apiGet('loadPaymentYear',{year:y}).then(function(d){
    LDG.busy[y]=false;
    // 받는 사이에 원생 정보를 고쳤으면 옛 내용일 수 있다 → 버리고, 저장이 끝난 뒤 다시 받는다
    if(STU_BUSY||gen!==STU_GEN){if(!STU_BUSY&&VIEW==='ledger')ldgFetchYear(y);return}
    LDG.at[y]=Date.now();
    var first=!LDG.Y[y];
    ldgKeepSaving(y,d);
    LDG.Y[y]=d;ldgWriteCache(y);
    if(VIEW!=='ledger'||ldgYears().indexOf(y)<0)return;
    LDG.err='';if(first)LDG.fresh=y;
    ldgRender();
  }).catch(function(e){
    LDG.busy[y]=false;
    if(VIEW!=='ledger'||ldgYears().indexOf(y)<0)return;
    if(!LDG.Y[y]){LDG.err=errKo(e);ldgRender()}
    else T('최신 내용을 못 불러왔어요');
  });
}
// 저장 중인 칸은 방금 받은 내용 대신 화면 값을 유지
function ldgKeepSaving(y,d){
  Object.keys(LDG.saving).forEach(function(k){
    var v=LDG.saving[k];if(v.y!==y)return;
    var o=ldgStu(y,v.name),n=null;
    d.students.forEach(function(s){if(s.name===v.name)n=s});
    if(!o||!n)return;
    if(o.months[v.m])n.months[v.m]=o.months[v.m];else delete n.months[v.m];
  });
}

// LDG.anim: 다음 번 그릴 때 표가 들어오는 방향 (next/prev/zoom). 한 번 쓰고 지운다
function ldgShift(d){
  for(var k=0,n=LDG.wide?3:1;k<n;k++){var c=d<0?ldgPrev(LDG.y,LDG.m):ldgNext(LDG.y,LDG.m);LDG.y=c.y;LDG.m=c.m}
  LDG.anim=d<0?'prev':'next';ldgLoad();
}
function ldgGoNow(){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth()+1;
  if(LDG.y===y&&LDG.m===m)return;
  LDG.anim=(y*12+m)<(LDG.y*12+LDG.m)?'prev':'next';LDG.y=y;LDG.m=m;ldgLoad();
}
function ldgSetWide(w){
  if(LDG.wide===!!w)return;
  // 선택 표시가 먼저 미끄러진 뒤 표가 바뀐다
  var seg=document.querySelector('.seg');if(seg)seg.classList.toggle('w',!!w);
  setTimeout(function(){LDG.wide=!!w;LDG.anim='zoom';if(VIEW==='ledger')ldgLoad();histSync()},seg?170:0);
}
function ldgToggleWide(){ldgSetWide(!LDG.wide)}

function ldgHeadHtml(){
  var c=ldgCols(),a=c[0],now=new Date(),isNow=LDG.y===now.getFullYear()&&LDG.m===now.getMonth()+1;
  var label=LDG.wide?(a.y!==LDG.y?a.y+'년 '+a.m+'월 – '+LDG.y+'년 '+LDG.m+'월':LDG.y+'년 '+a.m+' – '+LDG.m+'월'):LDG.y+'년 '+LDG.m+'월';
  return '<div class="pg-head"><div><div class="pg-kicker">SORI STUDIO</div><div class="pg-title">수납 현황</div></div>'+
    '<div class="seg'+(LDG.wide?' w':'')+'"><i></i><button type="button" onclick="ldgSetWide(false)">2개월</button><button type="button" onclick="ldgSetWide(true)">6개월</button></div></div>'+
    '<div class="mnav"><button type="button" class="mnav-b" aria-label="이전 달" onclick="ldgShift(-1)">'+ICON_PREV+'</button>'+
    '<div class="mnav-t"><span class="'+(LDG.anim?'in-'+LDG.anim:'')+'">'+label+'</span></div>'+
    '<button type="button" class="mnav-b" aria-label="다음 달" onclick="ldgShift(1)">'+ICON_NEXT+'</button></div>'+
    (isNow?'':'<div class="mnav-now"><button type="button" onclick="ldgGoNow()">이번 달로 돌아가기</button></div>');
}

function ldgSummaryHtml(rows){
  if(!LDG.Y[LDG.y])return '<div class="bar ldg-sum"><span class="bar-info">'+LDG.m+'월 수납 불러오는 중…</span></div>';
  var paid=0,sum=0,total=0;
  rows.forEach(function(s){
    if(s.retired)return;total++;
    var c=ldgCell(LDG.y,LDG.m,s.name);if(c&&c.paid){paid++;sum+=Number(s.fee)||0}
  });
  // 막대는 직전 값에서 새 값으로 채워진다 (ldgRender가 그린 뒤에 넓힌다)
  var left=total-paid,pct=total?Math.round(paid/total*100):0,from=LDG.pct||0;LDG.pct=pct;
  var tier=sum>=3000000?3:sum>=2000000?2:sum>=1000000?1:0;
  return '<div class="sumc"><div class="sumc-top"><div><div class="sumc-l">'+LDG.m+'월 수납</div><div class="sumc-n">'+paid+'<span>/ '+total+'명</span></div></div>'+
    '<div class="sumc-r">'+(total?'<span class="sumc-p'+(left?'':' ok')+'">'+(left?'미납 '+left+'명':'모두 납부')+'</span>':'')+'<div class="sumc-w'+(tier?' t'+tier:'')+'">₩'+sum.toLocaleString()+'</div></div></div>'+
    '<div class="sumc-bar"><i id="sumBar" data-to="'+pct+'" style="width:'+from+'%"></i></div>'+
    '<div class="sumc-st">'+[1,2,3].map(function(k){return '<span'+(tier>=k?' class="t'+k+'"':'')+'>'+k+'00만</span>'}).join('')+'</div></div>';
}

// 보이는 해들의 원생을 합친 줄 목록 (최근 해 순서 우선)
function ldgRows(){
  var seen={},rows=[];
  ldgYears().reverse().forEach(function(y){
    var d=LDG.Y[y];if(!d)return;
    d.students.forEach(function(s){if(!seen[s.name]){seen[s.name]=1;rows.push(s)}});
  });
  // 아직 받은 해가 하나도 없으면 원생 목록으로 줄부터 그려 둔다
  if(!rows.length&&!ldgYears().some(function(y){return LDG.Y[y]})){
    S.forEach(function(s){rows.push({name:s.name,fee:stuFeeNum(s.fee),feeDisplay:s.fee,level:s.level,freq:s.freq,method:s.method||'',retired:false,months:{}})});
  }
  return rows;
}

function ldgCellHtml(i,c,isCur){
  if(!LDG.Y[c.y])return '<td class="c-m c-wait'+(isCur?' c-cur':'')+'"><i></i></td>';
  var s=LDG.rows[i],v=ldgCell(c.y,c.m,s.name);
  var cls='c-m'+(isCur?' c-cur':'')+(LDG.fresh===c.y?' c-fresh':'');
  var paid=!!(v&&v.paid),due=paid||s.retired?0:ldgDue(c.y,c.m),inner='';
  var pick=!!(LDG.sel&&LDG.sel[ldgKey(s.name,c.y,c.m)]);
  if(pick)return '<td class="'+cls+'" onclick="ldgEdit('+i+','+c.y+','+c.m+')"><div class="tl pick"><span class="pk">✓</span></div></td>';
  if(paid)inner='<span class="pd"><span class="ck'+(LDG.pop===ldgKey(s.name,c.y,c.m)?' pop':'')+'">✓</span><span class="dt">'+ldgShortDate(v.date)+'</span></span>';
  else if(due)inner='<span class="due">미납</span>';
  if(v&&v.memo)inner+='<span class="memo">'+esc(String(v.memo))+'</span>';
  return '<td class="'+cls+'" onclick="ldgEdit('+i+','+c.y+','+c.m+')"><div class="tl'+(paid?' paid':due?' d'+due:'')+'">'+inner+'</div></td>';
}

function ldgRender(){
  var cols=ldgCols(),now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1,h=ldgHeadHtml();
  var rows=LDG.rows=ldgRows();
  if(LDG.err)h+='<div class="bar"><span class="bar-info">불러오기 실패: '+esc(LDG.err)+'</span><button class="btn btn-d" onclick="ldgLoad(true)">다시 시도</button></div>';
  else h+=ldgSummaryHtml(rows);
  var nsel=LDG.sel?Object.keys(LDG.sel).length:0;
  h+='<div class="ldg-wrap'+(LDG.anim?' in-'+LDG.anim:'')+'" id="ldgWrap"><table class="ldg'+(LDG.wide?' wide':'')+(LDG.sel?' sel':'')+'"><thead><tr><th class="c-nm">'+
    (LDG.sel?'<button type="button" class="bt on" onclick="ldgSelOff()">고르기 취소</button>':'<button type="button" class="bt" onclick="ldgSelOn()">'+(LDG.wide?'':ICON_PICK)+'일괄 수납</button>')+'</th>';
  cols.forEach(function(c){h+='<th class="c-mh'+(c.y===cy&&c.m===cm?' c-cur':'')+'"><button type="button" class="mh" aria-label="'+(LDG.wide?'2개월로 접기':'6개월로 펼치기')+'" onclick="ldgToggleWide()">'+c.m+'월'+(LDG.wide?'':ICON_WIDE)+'</button></th>'});
  h+='</tr></thead><tbody>';
  rows.forEach(function(s,i){
    // 6개월 보기는 자리가 없어 이름만 보인다
    var ed=' onclick="ldgNameTap('+i+')"',pm=s.retired?'퇴원':esc(String(s.method||''));
    var sb=esc([ldgFee(s.feeDisplay),[s.level,ldgFreq(s.freq)].filter(Boolean).join(' ')].filter(Boolean).join(' · '));
    h+='<tr'+(s.retired?' class="r-ret"':'')+'><td class="c-nm"'+ed+'><div class="nmw"><span class="no">'+(i+1)+'</span><div class="nmc"><div class="nml"><span class="nm">'+esc(String(s.name))+'</span>'+
      (pm&&!LDG.wide?'<span class="pm">'+pm+'</span>':'')+'</div>'+(sb&&!LDG.wide?'<div class="sb">'+sb+'</div>':'')+'</div></div></td>';
    cols.forEach(function(c){h+=ldgCellHtml(i,c,c.y===cy&&c.m===cm)});
    h+='</tr>';
  });
  if(!rows.length)h+='<tr><td class="c-empty" colspan="'+(cols.length+1)+'">원생이 없어요</td></tr>';
  h+='</tbody></table></div>';
  h+='<div class="ldg-lg"><span>미납</span><span><i style="background:#FBF1CB"></i>6일부터</span><span><i style="background:#FBE1CA"></i>16일부터</span><span><i style="background:#F8D8D4"></i>달 넘김</span></div>';
  h+='<div class="ldg-cap">칸을 누르면 납부일 · 이름을 누르면 원생 정보<br>표를 옆으로 밀거나 ‹ ›를 누르면 '+(LDG.wide?'3개월씩':'한 달씩')+' 넘어가요</div>';
  if(LDG.sel)h+='<div class="ldg-pad"></div><div class="fab-wrap"><div class="det-btns"><button type="button" class="btn btn-d" onclick="ldgSelOff()">취소</button>'+
    '<button type="button" class="btn-fab" onclick="ldgSelAsk()"'+(nsel?'':' disabled')+'>'+(nsel?nsel+'칸 납부 처리':'칸을 골라주세요')+'</button></div></div>';
  var st=window.scrollY;Q('app',h);window.scrollTo(0,st);
  LDG.anim='';LDG.pop='';LDG.fresh=0;
  var sb=document.getElementById('sumBar');
  if(sb)setTimeout(function(){sb.style.width=sb.getAttribute('data-to')+'%'},30);
}

// ── 칸: 납부일·메모 ──
// 납부일은 직전에 저장한 날짜로 열린다 (같은 날 낸 사람들을 연달아 적기 편하게). 앱을 새로 켜면 오늘.
function ldgEdit(i,y,m){
  var s=LDG.rows[i];if(!s||!LDG.Y[y]||Date.now()-LDG.swiped<400)return;
  if(LDG.sel){ldgSelToggle(s.name,y,m);return}
  var c=ldgCell(y,m,s.name)||{},paid=!!c.paid,a='('+i+','+y+','+m+',';
  showModal('<div class="modal-title">'+esc(String(s.name))+' · '+m+'월</div>'+
    '<div class="modal-fee">'+(Number(s.fee)?'수강료 <b>'+Number(s.fee).toLocaleString()+'원</b>':'수강료가 아직 안 적혀 있어요')+'</div>'+
    '<label class="fld"><span>납부일</span><input type="date" id="edDate" value="'+esc(c.date||LDG.lastDate||ldgToday())+'"></label>'+
    '<div class="chips"><button type="button" onclick="ldgPickDate(0)">오늘</button><button type="button" onclick="ldgPickDate(-1)">어제</button></div>'+
    '<label class="fld"><span>메모</span><input type="text" id="edMemo" maxlength="40" placeholder="예: 11만 주2회" value="'+esc(String(c.memo||''))+'"></label>'+
    '<div class="modal-btns">'+
    (paid?'<button class="btn btn-d" onclick="ldgSaveFromEditor'+a+'false)">납부 취소</button><button class="btn btn-y" onclick="ldgSaveFromEditor'+a+'true)">저장</button>'
         :'<button class="btn btn-d" onclick="ldgSaveFromEditor'+a+'false)">메모만 저장</button><button class="btn btn-y" onclick="ldgSaveFromEditor'+a+'true)">납부 저장</button>')+
    '</div>');
}
function ldgPickDate(off){
  var d=new Date();d.setDate(d.getDate()+off);
  var el=document.getElementById('edDate');
  if(el)el.value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function ldgSaveFromEditor(i,y,m,paid){
  var s=LDG.rows[i];
  var d=(document.getElementById('edDate')||{}).value||ldgToday();
  var memo=(document.getElementById('edMemo')||{}).value||'';
  closeModal();
  if(s)ldgSave(s.name,y,m,paid,d,memo,true);
}

// ── 일괄 수납: 칸을 여러 개 골라 한 번에 납부 처리 ──
// LDG.sel = 고르기 모드일 때만 있는 {칸 키:{name,y,m}}. 이 모드에서는 칸을 눌러도 창이 안 뜨고 고르기만 된다
function ldgSelOn(){LDG.sel={};ldgRender();histSync()}
function ldgSelOff(){if(!LDG.sel)return;LDG.sel=null;if(VIEW==='ledger')ldgRender();histSync()}
function ldgSelToggle(name,y,m){
  if(!LDG.Y[y])return;
  var c=ldgCell(y,m,name),k=ldgKey(name,y,m);
  if(c&&c.paid){T('이미 납부한 칸이에요');return}
  if(LDG.sel[k])delete LDG.sel[k];else LDG.sel[k]={name:name,y:y,m:m};
  ldgRender();
}
function ldgSelList(){return Object.keys(LDG.sel||{}).map(function(k){return LDG.sel[k]})}
// 이름을 누르면 원생 정보. 고르기 모드에서는 맨 오른쪽 달 칸을 고른다
function ldgNameTap(i){
  var s=LDG.rows[i];if(!s)return;
  if(LDG.sel)ldgSelToggle(s.name,LDG.y,LDG.m);else stuEdit(s.name);
}
function ldgSelAsk(){
  var a=ldgSelList();if(!a.length)return;
  showModal('<div class="modal-title">'+a.length+'칸 납부 처리</div>'+
    '<div class="modal-desc">'+a.map(function(v){return esc(String(v.name))+' '+v.m+'월'}).join(' · ')+'</div>'+
    '<div class="modal-fee">합계 <b>'+a.reduce(function(t,v){var r=null;LDG.rows.forEach(function(x){if(x.name===v.name)r=x});return t+(r?Number(r.fee)||0:0)},0).toLocaleString()+'원</b></div>'+
    '<label class="fld"><span>납부일</span><input type="date" id="edDate" value="'+esc(LDG.lastDate||ldgToday())+'"></label>'+
    '<div class="chips"><button type="button" onclick="ldgPickDate(0)">오늘</button><button type="button" onclick="ldgPickDate(-1)">어제</button></div>'+
    '<div class="modal-btns"><button type="button" class="btn btn-d" onclick="closeModal()">취소</button><button type="button" class="btn btn-y" onclick="ldgSelSave()">납부 저장</button></div>');
}
// 고른 칸을 세 줄로 나눠 차례로 보낸다 (전부 한꺼번에 보내면 서버에서 서로 기다리다 실패할 수 있다). 적어 둔 메모는 그대로 둔다
function ldgSelSave(){
  var d=(document.getElementById('edDate')||{}).value||ldgToday(),a=ldgSelList(),was=[],gate=[];
  LDG.sel=null;closeModal();
  a.forEach(function(v,i){
    var memo=String((ldgCell(v.y,v.m,v.name)||{}).memo||'');
    was.push({v:v,memo:memo});
    gate[i%3]=ldgSave(v.name,v.y,v.m,true,d,memo,false,gate[i%3])||gate[i%3];
  });
  LDG.lastDate=d;
  if(VIEW==='ledger')ldgRender();
  T(a.length+'칸 납부 저장',function(){
    var g=[];was.forEach(function(w,i){g[i%3]=ldgSave(w.v.name,w.v.y,w.v.m,false,'',w.memo,false,g[i%3])||g[i%3]});
    T('되돌렸어요');
  });
}

// 화면에 바로 반영하고 서버에는 뒤에서 보낸다. 저장 중에도 같은 칸을 또 고칠 수 있다 (wq가 순서를 지킨다)
// undoable이면 "되돌리기"가 붙은 알림을 띄운다. after(앞선 저장)를 주면 그 저장이 끝난 뒤에 보낸다
function ldgSave(name,y,m,paid,date,memo,undoable,after){
  var key=ldgKey(name,y,m);
  if(!LDG.Y[y])return;
  var s=ldgStu(y,name);
  if(!s){
    // 그 해 표에 없는 원생(다른 해에서 온 줄)이면 줄을 만들어 둔다
    var src=null;LDG.rows.forEach(function(r){if(r.name===name)src=r});
    s={name:name,fee:src?src.fee:0,feeDisplay:src?src.feeDisplay:'',level:src?src.level:'',freq:src?src.freq:'',method:src?src.method:'',retired:!!(src&&src.retired),months:{}};
    LDG.Y[y].students.push(s);
  }
  var prev=s.months[m]?JSON.parse(JSON.stringify(s.months[m])):null;
  var next={paid:!!paid,date:paid?(date||ldgToday()):'',memo:String(memo||'').trim()};
  var was={paid:!!(prev&&prev.paid),date:prev&&prev.paid?String(prev.date||''):'',memo:prev?String(prev.memo||'').trim():''};
  if(was.paid===next.paid&&was.date===next.date&&was.memo===next.memo)return; // 바뀐 게 없음
  if(!next.paid&&!next.memo)delete s.months[m];else s.months[m]=next;
  if(next.paid){if(undoable)LDG.lastDate=next.date;if(!was.paid)LDG.pop=key}
  var ver=LDG.ver[key]=(LDG.ver[key]||0)+1;
  LDG.saving[key]={name:name,y:y,m:m};
  if(VIEW==='ledger')ldgRender();
  if(undoable){
    T(name+' '+m+'월 '+(next.paid?(was.paid?'수정':'납부 저장'):(was.paid?'납부 취소':'메모 저장')),function(){
      ldgSave(name,y,m,was.paid,was.date,was.memo);T('되돌렸어요');
    });
  }
  return wq(name,function(){
    return (after||Promise.resolve()).then(function(){
      return apiPost('savePaymentCell',{year:y,month:m,name:name,paid:next.paid,date:next.date,memo:next.memo},true);
    });
  }).then(function(){
    if(LDG.ver[key]!==ver)return; // 그 사이 같은 칸을 또 고쳤음 → 마지막 저장이 정리한다
    delete LDG.saving[key];ldgWriteCache(y);
  }).catch(function(e){
    T('저장 실패: '+errKo(e));
    if(LDG.ver[key]!==ver)return;
    delete LDG.saving[key];
    var s2=ldgStu(y,name);
    if(s2){if(prev)s2.months[m]=prev;else delete s2.months[m]}
    if(VIEW==='ledger')ldgRender();
  });
}

// ═══ 원생 탭 ═══
// 원생 추가·수정·퇴원·복원은 여기가 본진. 수납 현황표에서 이름을 눌러도 같은 수정 창이 뜬다.
var STU_ED=''; // 수정 창이 열려 있는 원생 이름 ('' = 새로 추가)
function stuInfo(name){for(var i=0;i<S.length;i++)if(S[i].name===name)return S[i];return null}
function stuFind(name){
  var p=stuInfo(name);if(p)return p;
  for(var i=0;i<RET.length;i++)if(RET[i].name===name)return RET[i];
  return null;
}
function stuAdopt(s){if(s.kw)KW[s.row]=s.kw;PrevKW[s.row]=s.prevKw||'';if(s.msg)MSG[s.row]=s.msg;if(s.done)DONE.add(s.row)}
function stuFeeNum(t){var n=parseInt(String(t||'').replace(/,/g,''),10);return isNaN(n)?0:n}
function stuRefresh(){if(VIEW==='ledger')ldgLoad(true);else if(VIEW==='students')rStudents()}
// 레벨 색: 기초 → 초급 → 중급 → 고급 (요약 막대와 줄 앞 네모가 같은 색). 그 밖의 레벨은 -1(회색)
var STU_LV=['기초','초급','중급','고급','입시'],STU_LV_C=['#EBD583','#A3CBB2','#F1BD90','#E9A79F','#9CC6E8'];
function stuLv(s){var t=String(s.level||'');for(var i=0;i<STU_LV.length;i++)if(t.indexOf(STU_LV[i])>=0)return i;return -1}

// 맨 위 요약: 인원 + 한 달 수강료(숫자로 적힌 것만 더함) + 레벨별 인원 막대
function stuSummaryHtml(){
  var n=STU_LV.map(function(){return 0}),etc=0,sum=0,fees=0;
  S.forEach(function(s){
    var k=stuLv(s);if(k<0)etc++;else n[k]++;
    if(/^[\d,]+$/.test(String(s.fee||'').trim())){sum+=stuFeeNum(s.fee);fees++}
  });
  var bar='',lg='';
  STU_LV.forEach(function(t,k){
    if(!n[k])return;
    bar+='<i style="flex:'+n[k]+';background:'+STU_LV_C[k]+'"></i>';
    lg+='<span><i style="background:'+STU_LV_C[k]+'"></i>'+t+'<b>'+n[k]+'</b></span>';
  });
  if(etc){bar+='<i style="flex:'+etc+';background:#DDD8CF"></i>';lg+='<span><i style="background:#DDD8CF"></i>레벨 미정<b>'+etc+'</b></span>'}
  // 수강료를 안 적은 원생이 있으면 몇 명분인지 같이 보여준다
  return '<div class="sumc"><div class="sumc-top"><div><div class="sumc-l">다니는 원생</div><div class="sumc-n">'+S.length+'<span>명</span></div></div>'+
    '<div class="sumc-r"><div class="sumc-l">한 달 수강료'+(fees<S.length?' · '+fees+'명분':'')+'</div><div class="sumc-w">₩'+sum.toLocaleString()+'</div></div></div>'+
    '<div class="lvbar">'+bar+'</div><div class="lvlg">'+lg+'</div></div>';
}

// 수정 창. name이 ''이면 새 원생
function stuEdit(name){

    '<div class="fld-row">'+f('학부모명','stParent',p?p.parentName:'','')+f('연락처','stPhone',p?telFmt(p.phone):'','010-0000-0000','tel')+'</div>';

// 전화번호를 010-1234-5678 모양으로. 0으로 시작하는 9~11자리일 때만 (그 밖의 값은 적힌 그대로)
function telFmt(v){
  var t=String(v==null?'':v).trim(),d=t.replace(/\D/g,'');
  if(!/^0\d{8,10}$/.test(d)||/[^\d\s-]/.test(t))return t;
  var a=d.slice(0,2)==='02'?2:3,r=d.slice(a);
  return d.slice(0,a)+'-'+r.slice(0,r.length-4)+'-'+r.slice(-4);
}
document.getElementById('modalCard').addEventListener('focusout',function(e){var t=e.target;if(t&&t.id==='stPhone')t.value=telFmt(t.value)});
// 다른 입력칸으로 옮겨 가면 펼쳐져 있던 선택지를 접는다
function stuPickClose(){[].forEach.call(document.querySelectorAll('.chips.pk.open'),function(p){p.classList.remove('open')})}
document.getElementById('modalCard').addEventListener('focusin',function(e){
  var t=e.target;if(t&&t.tagName==='INPUT'&&!(t.readOnly&&t.classList.contains('pick')))stuPickClose();
});
// 선택지가 다른 칸 위에 떠 있으므로, 선택지와 고르는 칸이 아닌 곳을 누르면 접는다
document.getElementById('modalCard').addEventListener('click',function(e){
  var t=e.target;if(t&&t.closest&&!t.closest('.chips.pk')&&!t.closest('.fld'))stuPickClose();
});
// ── 고르는 칸 (수강료·결제수단·레벨·주 횟수·성별) ──
// 칸을 누르면 그 줄 밑에 선택지가 펼쳐지고, 고르면 접힌다. 연필을 누르면 목록에 없는 값을 직접 적을 수 있다
// 전부 하나만 고른다 (고르면 바로 접힘). 결제수단이 둘인 원생은 "앱/카드" 버튼이나 "직접"으로
var STU_PICK={stFee:['110,000','120,000','130,000','140,000','150,000'],stMethod:LDG_METHODS.concat(['앱/카드']),stLevel:STU_LV,stFreq:['1','2','3','4','5'],
  stGrade:['초1','초2','초3','초4','초5','초6','중1','중2','중3','고1','고2','고3','성인'],stGender:['남','여']};
var STU_PICK_BR={'중1':1,'성인':1}; // 학년 선택지에서 줄을 바꾸는 자리
function stuPickLabel(id,x){return id==='stFee'?parseInt(x,10)/10+'만':id==='stFreq'?x+'회':x}
function stuPickHtml(ids){
  return ids.map(function(id){
    return '<div class="chips pk'+(id==='stGrade'?' tight':'')+'" id="pk_'+id+'">'+STU_PICK[id].map(function(x){
      return (id==='stGrade'&&STU_PICK_BR[x]?'<i class="br"></i>':'')+'<button type="button" data-v="'+x+'" onclick="stuPickSet(\''+id+'\',\''+x+'\')">'+stuPickLabel(id,x)+'</button>';
    }).join('')+(id==='stGender'?'':'<button type="button" class="pen" aria-label="직접 적기" onclick="stuPickType(\''+id+'\')">'+ICON_PEN+'직접</button>')+'</div>'; // 성별은 남·여뿐
  }).join('');
}
function stuPickOpen(id){
  var el=document.getElementById(id);if(!el||!el.readOnly)return; // 직접 적는 중이면 그냥 입력칸
  [].forEach.call(document.querySelectorAll('.chips.pk'),function(p){p.classList.toggle('open',p.id==='pk_'+id&&!p.classList.contains('open'))});
  stuPickMark();
}
function stuPickSet(id,x){
  var el=document.getElementById(id);if(!el)return;
  el.value=x;
  stuPickMark();
  document.getElementById('pk_'+id).classList.remove('open');
}
function stuPickType(id){
  var el=document.getElementById(id);if(!el)return;
  el.readOnly=false;el.classList.remove('pick');el.placeholder='';
  document.getElementById('pk_'+id).classList.remove('open');
  el.focus();
}
function stuPickMark(){
  Object.keys(STU_PICK).forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    var v=el.value.trim();
    [].forEach.call(document.querySelectorAll('#pk_'+id+' button[data-v]'),function(b){b.classList.toggle('on',b.getAttribute('data-v')===v)});
  });
}

// 수정은 창을 바로 닫고 뒤에서 저장한다. 새 원생만 서버가 줄 번호를 줄 때까지 기다린다
function stuSave(){
  function g(id){var el=document.getElementById(id);return el?el.value.trim():undefined}
  var orig=STU_ED,name=g('stName');
  if(!name){T('이름을 적어주세요');return}
  if(name!==orig&&stuFind(name)){T('같은 이름의 원생이 이미 있어요');return}
  var body={name:name,fee:g('stFee'),method:g('stMethod'),level:g('stLevel'),freq:g('stFreq'),grade:g('stGrade'),gender:g('stGender'),parentName:g('stParent'),phone:g('stPhone')};
  if(orig){
    var before=stuSnap(orig),same=true;
    // 연락처: 숫자가 그대로면 시트에 적힌 모양 그대로 둔다 (보여줄 때만 줄표를 넣었으므로)
    if(body.phone!==undefined&&body.phone.replace(/\D/g,'')===String(before.phone==null?'':before.phone).replace(/\D/g,''))body.phone=String(before.phone==null?'':before.phone).trim();
    for(var k in body)if(body[k]!==undefined&&body[k]!==String(before[k]==null?'':before[k]).trim())same=false;
    closeModal();
    if(same)return;
    stuCommit(orig,body);
    T(name+' 정보를 저장했어요',function(){stuCommit(name,before);T('되돌렸어요')});
    return;
  }
  var btn=document.getElementById('stSave');if(btn){btn.disabled=true;btn.textContent='저장 중...'}
  apiPost('studentAdd',body).then(function(r){
    closeModal();
    var n={row:r.row,name:name,grade:body.grade||'',gender:body.gender||'',gg:[body.grade,body.gender].filter(Boolean).join(' '),
      kw:'',prevKw:'',msg:'',hist:'',done:false,phone:body.phone||'',parentName:body.parentName||'',level:body.level||'',freq:body.freq||'',fee:body.fee||'',method:body.method||'',retired:false};
    S.push(n);stuAdopt(n);
    Object.keys(LDG.Y).forEach(function(y){
      LDG.Y[y].students.push({name:name,fee:stuFeeNum(body.fee),feeDisplay:body.fee||'',level:body.level||'',freq:body.freq||'',method:body.method||'',retired:false,months:{}});
    });
    T(name+' 원생을 추가했어요');
    stuRefresh();
  }).catch(function(e){
    if(btn){btn.disabled=false;btn.textContent='저장'}
    T('저장 실패: '+errKo(e));
  });
}

// 지금 화면에 있는 원생 정보 (되돌리기·실패 복구용). 수납 현황표에만 있는 원생은 표의 항목만
function stuSnap(name){
  var p=stuFind(name);
  if(p)return {name:p.name,fee:p.fee,method:p.method,level:p.level,freq:p.freq,grade:p.grade,gender:p.gender,parentName:p.parentName,phone:p.phone};
  var r=null;Object.keys(LDG.Y).forEach(function(y){r=r||ldgStu(y,name)});
  return r?{name:r.name,fee:r.feeDisplay,method:r.method,level:r.level,freq:r.freq}:{name:name};
}
// 화면 쪽 정보만 바꾼다 (f에 없는 항목은 그대로)
function stuApply(orig,f){
  var p=stuFind(orig);
  function v(k){return f[k]==null?'':f[k]}
  if(p){
    p.name=f.name;p.fee=v('fee');p.level=v('level');p.freq=v('freq');p.method=v('method');
    if(f.grade!==undefined){p.grade=v('grade');p.gender=v('gender');p.gg=[p.grade,p.gender].filter(Boolean).join(' ');p.parentName=v('parentName');p.phone=v('phone')}
  }
  Object.keys(LDG.Y).forEach(function(y){
    var o=ldgStu(y,orig);if(!o)return;
    o.name=f.name;o.feeDisplay=v('fee');o.fee=stuFeeNum(f.fee);o.level=v('level');o.freq=v('freq');o.method=v('method');
    ldgWriteCache(y);
  });
}
function stuRedraw(){if(VIEW==='ledger')ldgRender();else if(VIEW==='students')rStudents()}
// 서버로 가는 중인 원생 저장 개수. 다 끝나면 수납 현황표를 새로 받는다. 실패가 있었으면 원생 목록도 다시 받는다
var STU_BUSY=0,STU_GEN=0,STU_FAIL=false;
function stuBusy(d){
  STU_BUSY+=d;if(STU_BUSY>0)return;
  LDG.at={};
  if(STU_FAIL){STU_FAIL=false;stuResync()}
  else if(VIEW==='ledger')ldgLoad(true);
}
function stuResync(){
  apiGet('loadStudents2').then(function(data){
    if(STU_BUSY)return;
    data=data||[];
    S=data.filter(function(s){return!s.retired});RET=data.filter(function(s){return s.retired});
    stuRefresh();
  }).catch(function(){});
}
// 원생 정보 저장: 화면 먼저, 서버는 뒤에서. 실패하면 원래대로 돌린다
function stuCommit(orig,f){
  var p=stuFind(orig),before=stuSnap(orig);
  var body={origName:orig,name:f.name,fee:f.fee,method:f.method,level:f.level,freq:f.freq,grade:f.grade,gender:f.gender,parentName:f.parentName,phone:f.phone};
  if(p)body.row=p.row;
  stuApply(orig,f);
  STU_BUSY++;STU_GEN++;
  var q=wq(orig,function(){return apiPost('studentUpdate',body,true)});
  if(f.name!==orig)WQ[f.name]=WQ[orig]; // 이름이 바뀌어도 뒤따르는 저장이 이 저장 다음에 가게
  q.then(function(){stuBusy(-1)},function(e){
    T('저장 실패: '+errKo(e));
    if(STU_BUSY===1){stuApply(f.name,before);stuRedraw()}
    STU_FAIL=true;stuBusy(-1);
  });
  stuRedraw();
}

function stuAskRetire(){
  var name=STU_ED;if(!name)return;
  showModal('<div class="modal-title">'+esc(name)+' 퇴원 처리</div>'+
    '<div class="modal-desc">메시지 목록과 수납 현황에서 숨겨요.<br>기록은 지워지지 않고, 원생 탭에서 언제든 복원할 수 있어요.</div>'+
    '<div class="modal-btns"><button type="button" class="btn btn-d" onclick="closeModal()">취소</button><button type="button" class="btn btn-y" onclick="stuRetire(true)">퇴원 처리</button></div>');
}
function stuRetire(retired){var name=STU_ED;closeModal();if(name)stuSetRetired(name,retired,true)}
function stuMove(name,retired){
  var from=retired?S:RET,to=retired?RET:S;
  for(var k=from.length-1;k>=0;k--){
    if(from[k].name===name){var x=from.splice(k,1)[0];x.retired=retired;to.push(x);if(!retired)stuAdopt(x)}
  }
  S.sort(function(a,b){return a.row-b.row});RET.sort(function(a,b){return a.row-b.row});
  Object.keys(LDG.Y).forEach(function(y){var o=ldgStu(y,name);if(o){o.retired=retired;ldgWriteCache(y)}});
}
function stuSetRetired(name,retired,undoable){
  var p=stuFind(name);
  stuMove(name,retired);
  STU_BUSY++;STU_GEN++;
  wq(name,function(){return apiPost('studentSetStatus',{name:name,retired:retired,row:p?p.row:undefined},true)}).then(function(){stuBusy(-1)},function(e){
    T('저장 실패: '+errKo(e));
    if(STU_BUSY===1){stuMove(name,!retired);stuRedraw()}
    STU_FAIL=true;stuBusy(-1);
  });
  stuRedraw();
  if(undoable)T(name+(retired?' 퇴원 처리했어요':' 복원했어요'),function(){stuSetRetired(name,!retired);T('되돌렸어요')});
}

// ═══ 폰 뒤로가기 버튼 ═══
// 화면이 깊어질 때마다(목록·상세·창 열기…) 브라우저 기록을 한 칸씩 쌓아 둔다.
// 그러면 폰의 뒤로가기가 앱을 끄지 않고 handleBack으로 들어와 한 단계만 돌아간다.
// HN = 지금 쌓아 둔 칸 수. 화면이 얕아지면(‹ 버튼, 창 닫기 등) 남는 칸을 걷어낸다.
// 아이폰에서는 아무것도 쌓지 않는다 (IS_IOS).
var HN=(history.state&&history.state.sori)||0,H_SKIP=false;
function histNeed(){
  var n=VIEW==='detail'?(DET_FROM==='input'?1:2):VIEW==='list'?1:VIEW==='ledger'?(LDG.wide?2:1)+(LDG.sel?1:0):VIEW==='students'?1:0;
  if(document.getElementById('msgbox'))n++;
  if(document.getElementById('modal').classList.contains('on'))n++;
  if(document.getElementById('tut').classList.contains('on'))n++;
  return n;
}
function histSync(){
  if(IS_IOS||H_SKIP)return; // H_SKIP: 걷어내는 중. 끝나면 다시 맞춘다
  var n=histNeed();
  try{
    while(HN<n){HN++;history.pushState({sori:HN},'')}
    if(HN>n){var d=HN-n;HN=n;H_SKIP=true;history.go(-d)}
  }catch(e){}
}
window.addEventListener('popstate',function(){
  if(H_SKIP){H_SKIP=false;histSync();return} // 우리가 걷어낸 것
  HN=Math.max(0,HN-1);
  handleBack();
  histSync();
});

function handleBack(){
  // 투토리얼 열려있으면 닫기
  if(document.getElementById('tut').classList.contains('on')){closeTutorial();return true}
  // 모달 열려있으면 닫기
  if(document.getElementById('modal').classList.contains('on')){closeModal();return true}
  var ta=document.getElementById('msgbox');
  if(ta){exitEdit(S[CI].row);return true}
  if(VIEW==='detail'){goBackFromDet();return true}
  if(VIEW==='ledger'){if(LDG.sel)ldgSelOff();else if(LDG.wide)ldgToggleWide();else rInput();return true}
  if(VIEW==='students'){rInput();return true}
  if(VIEW==='list'){rInput();return true}
  // 메인화면 → false 리턴 → MainActivity에서 종료 팝업
  return false;
}

// ═══ 수납 현황표를 옆으로 밀어 달 넘기기 (‹ › 버튼과 같은 동작) ═══
// 미는 동안 표가 손가락을 살짝 따라오고, 충분히 밀고 떼면 넘어간다. 위아래 스크롤은 그대로
(function(){
  var sx=0,sy=0,dx=0,mode=0,tb=null; // mode 0: 아직 모름 / 1: 옆으로 미는 중 / -1: 위아래 스크롤
  document.addEventListener('touchstart',function(e){
    tb=null;if(VIEW!=='ledger'||e.touches.length!==1)return;
    var w=e.target.closest?e.target.closest('#ldgWrap'):null;if(!w)return;
    tb=w.querySelector('.ldg');sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;mode=0;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!tb||mode<0)return;
    dx=e.touches[0].clientX-sx;var ax=Math.abs(dx),ay=Math.abs(e.touches[0].clientY-sy);
    if(!mode){
      if(ay>10&&ay>=ax){mode=-1;return}
      if(ax>10&&ax>ay*1.3){mode=1;tb.classList.add('drag')}else return;
    }
    tb.style.transform='translateX('+Math.round(dx*.4)+'px)';
  },{passive:true});
  function end(){
    var t=tb;tb=null;if(!t||mode!==1)return;
    t.classList.remove('drag');t.style.transform='';
    if(Math.abs(dx)>52){LDG.swiped=Date.now();ldgShift(dx<0?1:-1)}
  }
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',end,{passive:true});
})();

// ═══ 화면 왼쪽 끝에서 오른쪽으로 밀면 뒤로가기 ═══
(function(){
  var sx=0,sy=0,fromEdge=false;
  document.addEventListener('touchstart',function(e){
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;fromEdge=sx<28;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!fromEdge)return;fromEdge=false;
    if(V_DEPTH[VIEW]===0)return;
    if(document.getElementById('tut').classList.contains('on'))return;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);
    if(dx>70&&dy<60)handleBack();
  },{passive:true});
})();

init();
</script>
