<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F4F2EE">
<title>소리 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══ 소리 스튜디오 — C 테마 (미색 배경 + 떠 있는 흰 카드) ═══ */
:root{
  --bg:#F4F2EE;--card:#FFFFFF;--field:#F6F4F0;--line:#ECE8E1;
  --ink:#26231F;--ink2:#4A453E;--sub:#6E685F;--muted:#8F897F;
  --review:#9A4A1F;--review-bg:#FBEDE3;--review-dot:#C2652F;
  --done:#2F6443;--done-bg:#E6F1E9;--done-dot:#3F7A55;
  --ring:0 0 0 .5px rgba(38,35,31,.07);
  --lift:0 0 0 .5px rgba(38,35,31,.07),0 2px 10px rgba(38,35,31,.05);
  --lift2:0 0 0 .5px rgba(38,35,31,.07),0 6px 28px rgba(38,35,31,.07);
  --float:0 6px 24px rgba(38,35,31,.22),0 1px 3px rgba(38,35,31,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',-apple-system,sans-serif!important;background:var(--bg);color:var(--ink);max-width:500px;margin:0 auto;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;padding-bottom:120px}
*{font-family:'Noto Sans KR',-apple-system,sans-serif!important}
button{font-family:inherit}

/* 상단 */
.banner{padding:22px 20px 6px;cursor:pointer}
.banner-row{display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-size:12px;letter-spacing:.06em;color:var(--sub);font-weight:500}
.title{font-size:26px;font-weight:700;color:var(--ink);margin-top:2px;letter-spacing:-.025em}
.date{font-size:13px;color:var(--sub)}
.help-btn{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--lift);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:600;flex-shrink:0;transition:transform .12s}
.help-btn:active{transform:scale(.94)}

/* 목록·상세 화면에선 큰 앱 제목 숨기고 뒤로가기 줄이 맨 위 */
body[data-view=list] .banner,body[data-view=detail] .banner{display:none}
body[data-view=list] .page-head,body[data-view=detail] .det-head{padding-top:22px}

/* 화면 제목줄 (목록) */
.page-head{display:flex;align-items:center;gap:12px;padding:10px 16px 2px}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
.icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--card);box-shadow:var(--lift);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .12s}
.icon-btn:active{transform:scale(.94)}

/* 요약 카드 */
.bar{margin:14px 16px 0;padding:14px 16px;background:var(--card);border-radius:18px;box-shadow:var(--lift);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.bar-info{font-size:14px;color:var(--sub);line-height:1.5}
.bar-info b{color:var(--ink);font-weight:700}.bar-info .b-g{color:var(--done)}.bar-info .b-o{color:var(--review)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;min-height:40px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:transform .12s,opacity .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-y{background:var(--ink);color:#fff}
.btn-d{background:var(--field);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn-y-full{background:var(--ink);color:#fff;width:100%;height:56px;border-radius:28px;font-size:16px;font-weight:600;cursor:pointer;border:none;transition:transform .12s}
.btn-y-full:active{transform:scale(.98)}

/* 화면 아래 떠 있는 버튼 */
.fab-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:500px;padding:14px 16px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 55%,rgba(244,242,238,0));z-index:50}
.btn-fab{width:100%;height:56px;border:none;border-radius:28px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:var(--float);transition:transform .12s,opacity .12s}
.btn-fab:active{transform:scale(.98)}
.btn-fab:disabled{opacity:.35;box-shadow:none;cursor:default;transform:none}

/* 진행 막대 */
.progress{margin:12px 22px 0;height:4px;border-radius:2px;background:#E4DFD6;overflow:hidden}
.progress-fill{height:100%;background:var(--done-dot);border-radius:2px;transition:width .4s}

/* 생성 중 / 이어서 생성 */
.gen-bar,.resume-bar{margin:12px 16px 0;padding:10px 12px 10px 16px;background:var(--card);border-radius:16px;box-shadow:var(--lift);display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.resume-bar{justify-content:space-between}
.resume-bar span{font-size:14px;color:var(--ink2)}
.gen-bar .btn,.resume-bar .btn{min-height:32px;padding:6px 14px!important;font-size:13px!important}
.spin-s,.gen-bar .spin-s{width:16px;height:16px;border:2px solid #E4DFD6;border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}

/* 목록: 섹션 + 그룹 카드 */
.sec-header{padding:22px 22px 8px;display:flex;align-items:center;gap:7px}
.sec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sec-dot-y{background:#B3ADA3}.sec-dot-g{background:var(--done-dot)}.sec-dot-o{background:var(--review-dot)}
.sec-label{font-size:13px;font-weight:600;color:var(--sub);flex-shrink:0}
.sec-label-y,.sec-label-g,.sec-label-o{color:var(--sub)}
.sec-count{font-size:13px;color:var(--muted)}.sec-line{display:none}
.group{margin:0 16px;background:var(--card);border-radius:20px;box-shadow:var(--lift2);overflow:hidden}
.card{padding:13px 12px 13px 16px;min-height:56px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .12s}
.group .card+.card{border-top:.5px solid var(--line)}
.card:active{background:var(--field)}.card.done-card{opacity:.55}
.card-edit{cursor:default}.card-edit:active{background:transparent}
.av{display:none}
.card-body{flex:1;min-width:0}.card-name{font-size:16px;font-weight:600}
.card-kw{font-size:13px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:6px}
.card-kw-label{color:var(--muted);font-size:12px;font-weight:500;flex-shrink:0}
.card-kw-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-st{font-size:13px;font-weight:500;flex-shrink:0}
.st-review{color:var(--review)}.st-done{color:var(--done)}.st-ungen{color:var(--muted)}
.chev{color:#B3ADA3;display:flex;flex-shrink:0}
.card-kw-input{width:100%;height:38px;padding:0 12px;background:var(--field);border:1.5px solid transparent;border-radius:12px;color:var(--ink);font-size:15px;outline:none;margin-top:6px}
.card-kw-input:focus{border-color:var(--ink);background:#fff}
.empty{padding:48px 20px;text-align:center}
.empty p{color:var(--sub);font-size:14px;margin-bottom:16px}

/* 상태 알약 */
.pill{margin-left:auto;font-size:12px;font-weight:600;border-radius:14px;padding:6px 11px;border:none;white-space:nowrap;flex-shrink:0;line-height:1.2}
button.pill{cursor:pointer;transition:transform .12s}button.pill:active{transform:scale(.95)}
.pill-review{color:var(--review);background:var(--review-bg)}
.pill-done{color:var(--done);background:var(--done-bg)}

/* 첫 화면: 학생별 입력 카드 */
.inp-wrap{margin:10px 16px 0;padding:12px 14px 14px 16px;background:var(--card);border-radius:18px;box-shadow:var(--lift)}
.inp-wrap.done-inp{opacity:.55;pointer-events:none}
.inp-wrap.review-inp{cursor:pointer}
.inp-label{display:flex;align-items:center;gap:8px;margin:0 0 9px;min-height:26px}
.inp-num{display:none}
.inp-name{font-size:16px;font-weight:600}.inp-gg{font-size:13px;color:var(--sub)}
.inp-wrap input{width:100%;height:42px;padding:0 13px;background:var(--field);border:1.5px solid transparent;border-radius:12px;color:var(--ink);font-size:15px;outline:none;transition:border-color .15s,background .15s}
.inp-wrap input:focus{border-color:var(--ink);background:#fff}
.inp-wrap input::placeholder{color:var(--muted)}
.inp-wrap input.review-input{border-color:var(--review-dot);color:var(--review);pointer-events:none}

/* 상세 화면 */
.det-head{padding:10px 16px 0}
.det-row1{display:flex;align-items:center;justify-content:space-between}
.det-nav{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:22px;padding:0 4px;height:44px;box-shadow:var(--lift)}
.nav-b{width:38px;height:38px;border-radius:50%;border:none;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.nav-b:active{background:var(--field)}
.det-count{font-size:13px;font-weight:600;color:var(--ink2);min-width:40px;text-align:center}
.carousel{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 0;overflow:hidden}
.car-name{font-size:13px;color:var(--muted);transition:all .25s;white-space:nowrap;cursor:pointer;flex-shrink:0}
.car-name.active{font-size:14px;color:var(--ink);font-weight:600}
.car-name.near{font-size:13px;color:var(--muted)}
@keyframes carSlide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.car-anim{animation:carSlide .25s ease}
.det-body{padding:18px 16px 0}
.det-stu{display:flex;align-items:center;gap:12px;margin:0 6px 16px}
.det-av{display:none}
.det-name{font-size:26px;font-weight:700;letter-spacing:-.025em}
.det-gg{font-size:15px;font-weight:400;color:var(--sub);letter-spacing:0}
.det-sub{font-size:14px;color:var(--sub);margin-top:3px}
.msg-card{background:var(--card);border-radius:22px;box-shadow:var(--lift2);overflow:hidden;margin-bottom:16px}
.msg-card.done{background:#FBFCFA;box-shadow:0 0 0 1px var(--done-bg),0 6px 28px rgba(38,35,31,.05)}
.msg-display{width:100%;padding:22px 20px 12px;color:var(--ink);font-size:16px;line-height:1.75;min-height:220px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:none;user-select:none;cursor:text}
.msg-display.done{color:var(--ink2);cursor:default}
.msg-area{display:block;width:100%;padding:22px 20px 12px;background:#fff;border:none;color:var(--ink);font-size:16px;line-height:1.75;outline:none;resize:none;min-height:220px}
.msg-area.done{color:var(--ink2)}
.msg-foot{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 12px 20px;gap:8px}
.msg-edit-hint{font-size:12px;color:var(--sub)}
.regen-tag{border:none;background:var(--field);color:var(--ink);font-size:13px;font-weight:600;border-radius:16px;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;min-height:32px;cursor:pointer;transition:transform .12s}
.regen-tag:active{transform:scale(.96)}
.regen-wait{font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.regen-wait .spin-s{width:14px;height:14px}
.det-btns{display:flex;gap:10px}
.det-btns .btn{height:56px;border-radius:28px;padding:0 22px;background:var(--card);box-shadow:var(--lift);font-size:15px}
.det-btns .btn-fab{flex:1}
.sent-badge{display:inline-block;font-size:12px;font-weight:600;color:var(--done);background:var(--done-bg);padding:6px 11px;border-radius:14px;margin:0 6px 12px}
.short-warn{font-size:13px;color:var(--review);background:var(--review-bg);padding:10px 14px;border-radius:14px;margin-bottom:12px;line-height:1.5}

/* 로딩 · 토스트 */
.loading{display:flex;flex-direction:column;align-items:center;padding:72px 20px;color:var(--sub);font-size:14px;gap:14px}
.spin{width:24px;height:24px;border:2.5px solid #E4DFD6;border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none;box-shadow:var(--float);white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes slideL{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
.slide{animation:slideL .3s ease}
::-webkit-scrollbar{width:0}

/* 팝업 */
.modal-dim{position:fixed;inset:0;background:rgba(38,35,31,.32);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-dim.on{opacity:1;pointer-events:auto}
.modal-card{background:var(--card);border-radius:24px;padding:26px 20px 20px;width:calc(100% - 48px);max-width:340px;transform:scale(.96) translateY(8px);transition:transform .25s cubic-bezier(.2,.9,.3,1.1);text-align:center;box-shadow:0 20px 60px rgba(38,35,31,.18)}
.modal-dim.on .modal-card{transform:scale(1) translateY(0)}
.modal-icon{font-size:28px;margin-bottom:10px}
.modal-title{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px}
.modal-desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:6px}
.modal-names{font-size:13px;color:var(--ink2);background:var(--field);border-radius:12px;padding:10px 12px;margin:12px 0 18px;line-height:1.5;max-height:84px;overflow-y:auto}
.modal-btns{display:flex;gap:8px}.modal-btns .btn{flex:1;min-height:48px;border-radius:24px;font-size:14px}

/* 튜토리얼 */
.tut-dim{position:fixed;inset:0;background:rgba(38,35,31,.4);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tut-dim.on{opacity:1;pointer-events:auto}
.tut-box{width:calc(100% - 40px);max-width:360px;text-align:center;padding:30px 22px 20px;overflow:hidden;background:var(--card);border-radius:28px;box-shadow:0 20px 60px rgba(38,35,31,.2)}
@keyframes tutSlideLeft{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes tutSlideRight{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
.tut-slide-left{animation:tutSlideLeft .25s ease}
.tut-slide-right{animation:tutSlideRight .25s ease}
.tut-emoji{font-size:44px;margin-bottom:14px}
.tut-step{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.1em;margin-bottom:8px}
.tut-title{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:10px;line-height:1.4;letter-spacing:-.02em}
.tut-desc{font-size:14px;color:var(--sub);line-height:1.7;margin-bottom:8px}
.tut-example{background:var(--field);border-radius:16px;padding:14px 16px;margin:14px 0 20px;text-align:left}
.tut-example-label{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.06em;margin-bottom:6px}
.tut-example-text{font-size:13px;color:var(--ink2);line-height:1.6}
.tut-dots{display:flex;justify-content:center;gap:6px;margin-bottom:20px}
.tut-dot{width:7px;height:7px;border-radius:4px;background:#DCD6CC;transition:.2s}
.tut-dot.on{background:var(--ink);width:20px}
.tut-btns{display:flex;gap:8px}
.tut-btns .btn{flex:1;min-height:50px;border-radius:25px;font-size:15px}
.tut-skip{font-size:13px;color:var(--muted);margin-top:14px;cursor:pointer;padding:6px}
.tut-skip:active{color:var(--ink)}

/* ═══ 하단 탭 ═══ */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:500px;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:.5px solid rgba(38,35,31,.1);padding:4px 8px calc(4px + env(safe-area-inset-bottom));z-index:60}
.tab{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-height:52px;cursor:pointer}
.tab.on{color:var(--ink)}
.tab:active{opacity:.6}
body[data-view=list] .tabbar,body[data-view=detail] .tabbar{display:none}
body[data-view=input]{padding-bottom:180px}
body[data-view=input] .fab-wrap{bottom:calc(60px + env(safe-area-inset-bottom));padding-bottom:12px}
body[data-view=input] .toast,body[data-view=ledger] .toast{bottom:150px}
body[data-view=ledger] .banner{display:none}
body[data-view=ledger]{padding-bottom:90px}

/* ═══ 수납 현황표 ═══ */
.ldg-head{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 16px 0 20px}
.ldg-kicker{font-size:12px;letter-spacing:.06em;color:var(--sub);font-weight:500}
.ldg-title{font-size:26px;font-weight:700;letter-spacing:-.025em;margin-top:2px}
.ldg-title.sm{font-size:21px}
.ldg-tools{display:flex;gap:6px;padding:12px 16px 0 20px}
.chip,.chips button{border:none;background:var(--card);box-shadow:var(--ring);color:var(--ink2);font-size:12px;font-weight:600;padding:8px 12px;border-radius:15px;cursor:pointer}
.chip:active,.chips button:active{opacity:.6}
.ldg-hint{font-size:12px;color:var(--muted);padding:14px 22px 8px}
.ldg-wrap{margin:0 16px;background:var(--card);border-radius:18px;box-shadow:var(--lift2);overflow:hidden}
.ldg{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:13px;user-select:none;-webkit-user-select:none}
.ldg th{background:var(--field);color:var(--sub);font-size:12px;font-weight:600;padding:10px 6px;text-align:left;border-bottom:.5px solid var(--line)}
.ldg td{padding:6px;height:54px;border-bottom:.5px solid var(--line);color:var(--ink2);vertical-align:middle;overflow:hidden;cursor:pointer}
.ldg tr:last-child td{border-bottom:none}
.ldg td:active{background:var(--field)}
.ldg .c-nm{width:27%;padding-left:10px}
.ldg td.c-nm{font-weight:600;color:var(--ink);font-size:14px;white-space:nowrap}
.ldg .no{display:inline-block;min-width:17px;color:var(--muted);font-size:11px;font-weight:500}
.ldg .pm{display:block;margin-left:17px;font-size:10.5px;font-weight:500;color:var(--muted);line-height:1.2}
.ldg .pm:empty{display:none}
.ldg .c-fee{width:19%;text-align:right;font-variant-numeric:tabular-nums;word-break:keep-all;line-height:1.2}
.ldg .c-lv{width:18%;color:var(--sub);font-size:12px;line-height:1.3;word-break:keep-all}
.ldg th.c-mh{text-align:center;cursor:pointer}
.ldg th.c-cur{color:var(--ink);background:#ECE7DE}
.ldg td.c-m{text-align:center;padding:6px 2px;border-left:.5px solid var(--line);line-height:1.15;white-space:nowrap}
.ldg td.c-cur{background:#FBF9F5}
.ldg td.c-saving{opacity:.45}
.ldg td.c-empty{text-align:center;color:var(--muted);cursor:default}
.ldg tr.r-ret td,.ldg tr.r-ret td.c-nm{color:var(--muted)}
.ldg .ck{color:var(--done);font-weight:700;margin-right:2px}
.ldg .dt{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ldg .memo{display:block;font-size:10.5px;color:var(--review);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
/* 6개월 펼쳐보기: 이름 + 6달. 칸이 좁아서 ✓와 날짜를 두 줄로 */
.ldg.wide .c-nm{width:26%;padding-left:8px}
.ldg.wide td.c-nm{font-size:13px}
.ldg.wide .ck{display:block;margin:0;line-height:1}
.ldg.wide .dt{font-size:11px}
.ldg.wide .memo{font-size:9.5px}
.ldg-foot{display:flex;gap:8px;margin:14px 16px 0}
.ldg-foot .btn{flex:1;min-height:46px;border-radius:23px;background:var(--card);box-shadow:var(--lift)}

.ldg-sync{display:inline-flex;align-items:center;gap:6px}

<script>
// ═══ API 설정 ═══
// 테스트용 배포 주소(버전 42). main에 머지할 때 반드시 운영 주소(AKfycbzW7VPX…)로 되돌릴 것
var API_URL='https://script.google.com/macros/s/AKfycbxAyh5wKml5EPVFUIqSFDNKT4rsAMUlyV0i1615TzsbWWBQjL8Pm_t7rKPjofbirYXW/exec';
var IS_TEST=true; // Test 브랜치 전용. main에 머지할 때 반드시 false로

// TEST 모드 표시 (운영 앱과 구분용)
if(IS_TEST){
  document.title='[TEST] '+document.title;
  var _testBadge=document.createElement('div');
  _testBadge.textContent='TEST';
  _testBadge.style.cssText='position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:99999;background:#e53935;color:#fff;font:700 11px/1 sans-serif;letter-spacing:.12em;padding:4px 10px;border-radius:999px;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.25)';
  document.body.appendChild(_testBadge);
}

function apiGet(action,params){
  var url=API_URL+'?action='+action;
  if(IS_TEST)url+='&test=1';
  if(params)for(var k in params){if(params[k]!=null)url+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k])}
  return fetch(url)
    .then(function(r){return r.json()})
    .then(function(j){if(!j.ok)throw new Error(j.error);return j.data});
}
function apiPost(action,body){
  body.action=action;
  if(IS_TEST)body.test='1';
  return fetch(API_URL+(IS_TEST?'?test=1':''),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)})
    .then(function(r){return r.json()})
    .then(function(j){if(!j.ok)throw new Error(j.error);return j.data});
}

// ═══ State ═══
var S=[],KW={},PrevKW={},MSG={},SHORT={},DONE=new Set(),REGEN=new Set(),EDITED=new Set(),CI=0,CANCEL=false,EDITMODE=false,VIEW='input',GEN=false,GC=0,GT=0,GEN_TG=[];
var DET_FROM='list'; // 상세 화면에 들어온 곳: 'input'(첫 화면) 또는 'list'(목록)
function setView(v){VIEW=v;document.body.setAttribute('data-view',v);var a=document.getElementById('tabMsg'),b=document.getElementById('tabLdg');if(a&&b){a.classList.toggle('on',v!=='ledger');b.classList.toggle('on',v==='ledger')}} // 화면별 스타일(상단 제목 숨김 등)용

function init(){
  var d=new Date();
  document.getElementById('dt').textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월';
  Q('app','<div class="loading"><div class="spin"></div>학생 목록 불러오는 중...</div>');
  // loadStudents2: 퇴원 여부·결제수단 포함. 예전 Apps Script면 loadStudents로
  apiGet('loadStudents2').catch(function(e){
    if(/Unknown action/.test(e.message))return apiGet('loadStudents');
    throw e;
  }).then(function(data){
    data=data||[];
    S=data.filter(function(s){return!s.retired});
    RET=data.filter(function(s){return s.retired});
    S.forEach(stuAdopt);
    rInput();
    checkFirstRun();
  }).catch(function(e){
    Q('app','<div style="padding:20px;color:#f87171;font-size:13px;">연결 실패: '+e.message+'</div>');
  });
}

function goHome(){CANCEL=true;GEN=false;EDITMODE=false;rInput()}
function hasMsg(){return S.some(function(s){return MSG[s.row]})}
function isReview(s){return!DONE.has(s.row)&&MSG[s.row]&&MSG[s.row].trim()}
function isUngen(s){return!DONE.has(s.row)&&(!MSG[s.row]||!MSG[s.row].trim())}

function showModal(html){document.getElementById('modalCard').innerHTML=html;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}

// ═══ Main Screen ═══
function rInput(){
  setView('input');
  var pending=S.filter(function(s){return!DONE.has(s.row)});
  var kwCount=pending.filter(function(s){return(KW[s.row]||'').trim()&&isUngen(s)}).length;
  var reviewCount=S.filter(function(s){return isReview(s)}).length;
  var dc=S.length-pending.length;

  var h='<div class="bar"><span class="bar-info">';
  var infoParts=[];
  if(kwCount>0||pending.filter(function(s){return isUngen(s)}).length>0) infoParts.push('원생 <b>'+kwCount+'</b>/'+pending.filter(function(s){return isUngen(s)}).length+'명 입력');
  if(reviewCount>0) infoParts.push('<b class="b-o">'+reviewCount+'</b>명 검수대기');
  if(dc>0) infoParts.push('<b class="b-g">'+dc+'</b>명 복사완료');
  h+=infoParts.join(' · ')+'</span><div style="display:flex;gap:6px">';
  if(hasMsg())h+='<button class="btn btn-d" onclick="rList()">목록 보기</button>';
  var genableCount=pending.filter(function(s){return(KW[s.row]||'').trim()}).length;
  h+='</div></div>';

  S.forEach(function(s,i){
    var d=DONE.has(s.row);
    var rv=isReview(s);
    var ph=PrevKW[s.row]?'지난달: '+PrevKW[s.row]:'바이엘 2번, 밝음, 손가락 독립 잘됨';

    if(d){
      h+='<div class="inp-wrap done-inp"><div class="inp-label">'+
        '<span class="inp-name">'+s.name+'</span><span class="inp-gg">'+s.gg+'</span>'+
        '<span class="pill pill-done">복사 완료</span></div>'+
        '<input value="'+esc('(복사완료)')+'" disabled/></div>';
    }else if(rv){
      var rvPh=KW[s.row]||ph;
      h+='<div class="inp-wrap"><div class="inp-label">'+
        '<span class="inp-name">'+s.name+'</span><span class="inp-gg">'+s.gg+'</span>'+
        '<button type="button" class="pill pill-review" onclick="event.stopPropagation();showDet('+s.row+',\'input\')">AI 글 확인</button></div>'+
        '<input value="" placeholder="'+esc(rvPh)+'" oninput="kwCh('+s.row+',this.value)"/></div>';
    }else{
      h+='<div class="inp-wrap"><div class="inp-label">'+
        '<span class="inp-name">'+s.name+'</span><span class="inp-gg">'+s.gg+'</span></div>'+
        '<input value="'+esc(KW[s.row]||'')+'" '+
        'placeholder="'+esc(ph)+'" oninput="kwCh('+s.row+',this.value)"/></div>';
    }
  });
  h+='<div class="fab-wrap"><button class="btn-fab" id="gbtn" onclick="tryGenAll()" '+(genableCount===0?'disabled':'')+'>'+genLabel(genableCount)+'</button></div>';
  Q('app',h);
}

function genLabel(n){return n>0?n+'명 일괄 생성':'일괄 생성'}

function kwCh(row,v){
  KW[row]=v;
  var pending=S.filter(function(s){return!DONE.has(s.row)});
  var genableCount=pending.filter(function(s){return(KW[s.row]||'').trim()}).length;
  var b=document.getElementById('gbtn');if(b){b.disabled=genableCount===0;b.textContent=genLabel(genableCount)}
}

// ═══ Generate ═══
function tryGenAll(){
  var targets=S.filter(function(s){return(KW[s.row]||'').trim()&&!DONE.has(s.row)});
  var existing=targets.filter(function(s){return MSG[s.row]&&MSG[s.row].trim()});
  if(existing.length>0){
    var names=existing.map(function(s){return s.name}).join(', ');
    var newOnly=targets.filter(function(s){return!(MSG[s.row]&&MSG[s.row].trim())});
    showModal('<div class="modal-icon">📝</div>'+
      '<div class="modal-title">이미 생성된 메시지가 있습니다</div>'+
      '<div class="modal-desc">아래 '+existing.length+'명은 이미 AI 메시지가 있어요.<br>새로 생성하면 기존 메시지가 사라집니다.</div>'+
      '<div class="modal-names">'+esc(names)+'</div>'+
      '<div class="modal-btns">'+
      '<button class="btn btn-d" onclick="closeModal();genAllSkip()">'+(newOnly.length>0?'새 학생만 생성 ('+newOnly.length+'명)':'취소')+'</button>'+
      '<button class="btn btn-y" onclick="closeModal();genAllOverwrite()">전체 다시 생성</button></div>');
  }else{genAllOverwrite()}
}

function genAllOverwrite(){
  CANCEL=false;GEN=true;REGEN.clear();
  GEN_TG=S.filter(function(s){return(KW[s.row]||'').trim()&&!DONE.has(s.row)});
  if(!GEN_TG.length){GEN=false;rList();return}
  GEN_TG.forEach(function(s){delete MSG[s.row];delete SHORT[s.row]});
  GT=GEN_TG.length;GC=0;
  apiPost('saveKeywords',{updates:GEN_TG.map(function(s){return{row:s.row,kw:KW[s.row]}})});
  rList();runGen(0);
}

function genAllSkip(){
  CANCEL=false;GEN=true;REGEN.clear();
  GEN_TG=S.filter(function(s){return(KW[s.row]||'').trim()&&!DONE.has(s.row)&&!(MSG[s.row]&&MSG[s.row].trim())});
  if(!GEN_TG.length){GEN=false;T('새로 생성할 학생이 없습니다');rList();return}
  GEN_TG.forEach(function(s){delete MSG[s.row];delete SHORT[s.row]});
  GT=GEN_TG.length;GC=0;
  apiPost('saveKeywords',{updates:GEN_TG.map(function(s){return{row:s.row,kw:KW[s.row]}})});
  rList();runGen(0);
}

function resumeGen(){
  GEN_TG=S.filter(function(s){return(KW[s.row]||'').trim()&&!DONE.has(s.row)&&!MSG[s.row]});
  if(!GEN_TG.length){T('생성할 학생이 없습니다');return}
  CANCEL=false;GEN=true;GT=GEN_TG.length;GC=0;
  rList();runGen(0);
}

function runGen(idx){
  if(CANCEL||!GEN){GEN=false;updGB();if(!hasMsg())rInput();return}
  if(idx>=GEN_TG.length){GEN=false;GC=0;GT=0;updGB();return}
  var s=GEN_TG[idx];
  if(REGEN.has(s.row)||MSG[s.row]){runGen(idx+1);return}
  GC=idx+1;updGB();
  genKakao(s,KW[s.row],function(){return CANCEL}).then(function(r){
    if(CANCEL){GEN=false;if(!hasMsg())rInput();return}
    var m=r.text;if(r.short)SHORT[s.row]=true;
    MSG[s.row]=m;
    apiPost('saveMessage',{row:s.row,text:m});
    if(VIEW==='list')refreshCards();
    if(VIEW==='detail'){updDetCounter();T(s.name+' 생성 완료 ✓')}
    runGen(idx+1);
  }).catch(function(e){
    if(CANCEL){GEN=false;return}
    MSG[s.row]='[실패: '+e.message+']';
    if(VIEW==='list')refreshCards();
    runGen(idx+1);
  });
}

// ═══ AI 생성: 중간에 끊긴 글이면 자동으로 다시 요청 ═══
// 제미나이가 글을 문장 중간에 끊어서 보내는 경우가 있어서, 끝이 문장으로 안 끝나면 최대 3번까지 다시 받음.
// 3번 다 끊기면 마지막 결과를 쓰고 '짧음' 경고를 띄움.
// 새 Apps Script 기능(generateKakao2)은 "한도 때문에 잘렸는지"를 직접 알려줘서 추측하지 않아도 됨. 없으면 예전 방식으로.
var GEN_MAX_TRY=3,GEN_V2=true;
function looksCut(m){
  var t=(m||'').replace(/\s+$/,'');
  if(!t)return true;
  if(/[.!?~)\]"'”’」』…♡♥^]$/.test(t))return false;   // 문장부호로 끝남
  if(/[요다죠까네]$/.test(t))return false;              // 문장부호 없이 존댓말로 끝남
  var cp=Array.from(t).pop().codePointAt(0);
  if(cp>=0x1F000||(cp>=0x2600&&cp<=0x27BF)||(cp>=0x3131&&cp<=0x318E))return false; // 이모지, ㅎㅎ/ㅋㅋ
  return true;
}
function genKakao(s,kw,isCancelled){
  function attempt(n){
    return apiPost(GEN_V2?'generateKakao2':'generateKakao',{name:s.name,gg:s.gg,kw:kw,hist:s.hist}).then(function(d){
      var m,short=false,cut;
      if(typeof d==='string'){
        m=d;
        if(m.indexOf('[SHORT]')===0){short=true;m=m.substring(7)}
        cut=looksCut(m);
      }else{
        m=d.text||'';short=!!d.short;
        cut=d.reason==='MAX_TOKENS'||!m;
      }
      if(cut&&n<GEN_MAX_TRY&&!(isCancelled&&isCancelled()))return attempt(n+1);
      return {text:m,short:short||cut};
    },function(e){
      if(GEN_V2&&/Unknown action/.test(e.message)){GEN_V2=false;return attempt(n)}
      if(n<GEN_MAX_TRY&&!(isCancelled&&isCancelled())){
        return new Promise(function(res){setTimeout(res,800*n)}).then(function(){return attempt(n+1)});
      }
      throw e;
    });
  }
  return attempt(1);
}

function updGB(){
  var el=document.getElementById('genBar');if(!el)return;
  if(!GEN||GT===0){el.style.display='none';return}
  el.style.display='flex';
  el.innerHTML='<div class="spin-s"></div>'+GC+'/'+GT+'명 생성 중...<button class="btn btn-d" onclick="CANCEL=true;GEN=false;updGB();refreshCards()" style="padding:4px 10px;font-size:11px;margin-left:auto">취소</button>';
}

function updDetCounter(){
  var gl=S.filter(function(x){return MSG[x.row]});
  var s=S[CI],el=document.getElementById('detCount');
  if(el){var pos=gl.findIndex(function(x){return x.row===s.row})+1;el.textContent=pos+' / '+gl.length}
  var car=document.getElementById('carousel');
  if(car)car.innerHTML=buildCarousel(true);
}

function refreshCards(){
  var cl=document.getElementById('cardList');if(cl)cl.innerHTML=buildSectionedCards(EDITMODE);
  var reviewList=S.filter(function(s){return isReview(s)});
  var ungenList=S.filter(function(s){return(KW[s.row]||'').trim()&&isUngen(s)});
  var doneList=S.filter(function(s){return DONE.has(s.row)});
  var total=reviewList.length+ungenList.length+doneList.length;
  var pct=total?Math.round(doneList.length/total*100):0;
  var info=document.querySelector('.bar-info');
  if(info){
    var parts=[];
    if(ungenList.length>0)parts.push('미생성 <b>'+ungenList.length+'</b>명');
    if(reviewList.length>0)parts.push('검수대기 <b class="b-o">'+reviewList.length+'</b>명');
    if(doneList.length>0)parts.push('복사완료 <b class="b-g">'+doneList.length+'</b>명');
    info.innerHTML=parts.join(' · ');
  }
  var prog=document.querySelector('.progress-fill');if(prog)prog.style.width=pct+'%';
  var rb=document.getElementById('resumeBar');
  var remaining=S.filter(function(s){return(KW[s.row]||'').trim()&&!DONE.has(s.row)&&!MSG[s.row]}).length;
  if(rb){if(!GEN&&remaining>0){rb.style.display='flex';rb.querySelector('span').textContent=remaining+'명 미생성'}else{rb.style.display='none'}}
}

// ═══ List ═══
function rList(){
  setView('list');EDITMODE=false;EDITED.clear();
  var reviewList=S.filter(function(s){return isReview(s)});
  var ungenList=S.filter(function(s){return(KW[s.row]||'').trim()&&isUngen(s)});
  var doneList=S.filter(function(s){return DONE.has(s.row)});
  var total=reviewList.length+ungenList.length+doneList.length;
  var pct=total?Math.round(doneList.length/total*100):0;
  var remaining=S.filter(function(s){return(KW[s.row]||'').trim()&&!DONE.has(s.row)&&!MSG[s.row]}).length;

  var infoParts=[];
  if(ungenList.length>0)infoParts.push('미생성 <b>'+ungenList.length+'</b>명');
  if(reviewList.length>0)infoParts.push('검수대기 <b class="b-o">'+reviewList.length+'</b>명');
  if(doneList.length>0)infoParts.push('복사완료 <b class="b-g">'+doneList.length+'</b>명');

  var h='<div class="page-head"><button type="button" class="icon-btn" aria-label="뒤로" onclick="rInput()">'+ICON_BACK+'</button><span class="page-title">메시지</span></div>';
  h+='<div class="bar"><span class="bar-info">'+infoParts.join(' · ')+'</span>';
  if(reviewList.length>0)h+='<button class="btn btn-d" id="editBtn" onclick="toggleEdit()">키워드 수정</button>';
  h+='</div><div class="progress"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="gen-bar" id="genBar" style="display:none"></div>'+
    '<div class="resume-bar" id="resumeBar" style="'+((!GEN&&remaining>0)?'display:flex':'display:none')+'"><span>'+remaining+'명 미생성</span><button class="btn btn-y" onclick="resumeGen()" style="padding:8px 16px;font-size:12px">이어서 생성</button></div>'+
    '<div id="cardList">'+buildSectionedCards(false)+'</div>';
  Q('app',h);updGB();
}

function buildSectionedCards(edit){
  var gen=S.filter(function(s){return MSG[s.row]||DONE.has(s.row)});
  var reviewList=gen.filter(function(s){return isReview(s)});
  var ungenList=S.filter(function(s){return(KW[s.row]||'').trim()&&isUngen(s)&&!MSG[s.row]});
  var doneList=gen.filter(function(s){return DONE.has(s.row)});
  var h='';

  if(!gen.length&&!ungenList.length&&!GEN)return '<div class="empty"><p>생성된 메시지가 없습니다</p><button class="btn btn-y" onclick="rInput()">키워드 입력하러 가기</button></div>';
  if(!gen.length&&!ungenList.length&&GEN)return '';

  if(reviewList.length>0){
    h+='<div class="sec-header"><div class="sec-dot sec-dot-o"></div><span class="sec-label sec-label-o">검수대기</span><span class="sec-count">'+reviewList.length+'명</span><div class="sec-line"></div></div><div class="group">';
    reviewList.forEach(function(s){h+=buildOneCard(s,edit,'review')});
    h+='</div>';
  }
  if(ungenList.length>0){
    h+='<div class="sec-header"><div class="sec-dot sec-dot-y"></div><span class="sec-label sec-label-y">미생성</span><span class="sec-count">'+ungenList.length+'명</span><div class="sec-line"></div></div><div class="group">';
    ungenList.forEach(function(s){h+=buildOneCard(s,edit,'ungen')});
    h+='</div>';
  }
  if(doneList.length>0){
    h+='<div class="sec-header"><div class="sec-dot sec-dot-g"></div><span class="sec-label sec-label-g">복사완료</span><span class="sec-count">'+doneList.length+'명</span><div class="sec-line"></div></div><div class="group">';
    doneList.forEach(function(s){h+=buildOneCard(s,edit,'done')});
    h+='</div>';
  }
  return h;
}

function buildOneCard(s,edit,status){
  var kw=KW[s.row]||'',isShort=SHORT[s.row];
  if(edit&&status==='review'){
    return '<div class="card card-edit">'+
      '<div class="av av-o">'+s.name[0]+'</div><div style="flex:1;min-width:0"><div class="card-name">'+s.name+'</div>'+
      '<input class="card-kw-input" value="'+esc(kw)+'" oninput="onEditKw('+s.row+',this.value)" placeholder="키워드"/></div></div>';
  }
  var avC,stC,stT;
  if(status==='done'){avC='av-g';stC='st-done';stT='복사완료'}
  else if(status==='ungen'){avC='av-y';stC='st-ungen';stT='미생성'}
  else{avC='av-o';stC='st-review';stT=isShort?'짧음':'검수대기'}

  var stHtml;
  if(EDITED.has(s.row)&&status==='review'){
    stHtml='<button type="button" class="pill pill-review" onclick="event.stopPropagation();doRegenFromList('+s.row+')">다시 쓰기</button>';
  }else{stHtml='<span class="card-st '+stC+'">'+stT+'</span>'}

  var cardClass=status==='done'?'card done-card':'card';
  var clickAction=status==='ungen'?'':'onclick="showDet('+s.row+')"';
  return '<div class="'+cardClass+'" '+clickAction+'>'+
    '<div class="av '+avC+'">'+s.name[0]+'</div><div class="card-body"><div class="card-name">'+s.name+'</div>'+
    '<div class="card-kw"><span class="card-kw-label">키워드</span><span class="card-kw-text">'+esc(kw.substring(0,35))+'</span></div></div>'+
    stHtml+(status==='ungen'?'':'<span class="chev">'+ICON_NEXT+'</span>')+'</div>';
}

function onEditKw(row,v){if(KW[row]!==v)EDITED.add(row);KW[row]=v}

function doRegenFromList(row){

function buildCarousel(anim){
  var gl=S.filter(function(x){return MSG[x.row]});
  var pos=gl.findIndex(function(x){return x.row===S[CI].row});
  var prev=pos>0?gl[pos-1].name:'';
  var cur=gl[pos]?gl[pos].name:'';
  var nxt=pos<gl.length-1?gl[pos+1].name:'';
  var cls=anim?' car-anim':'';
  var h='';
  if(prev)h+='<span class="car-name near" onclick="nav(-1)">'+prev+'</span>';
  h+='<span class="car-name active'+cls+'">'+cur+'</span>';
  if(nxt)h+='<span class="car-name near'+cls+'" onclick="nav(1)">'+nxt+'</span>';
  return h;
}

function rDet(slide){

function enterEdit(row){
  var div=document.getElementById('msgdiv');if(!div)return;
  var m=MSG[row]||'';
  var ta=document.createElement('textarea');
  ta.className='msg-area';ta.id='msgbox';ta.value=m;
  ta.addEventListener('input',function(){MSG[row]=this.value;SHORT[row]=false});
  ta.addEventListener('touchmove',function(){ta.blur()},{passive:true});
  div.parentNode.replaceChild(ta,div);
  var hint=document.querySelector('.msg-edit-hint');
  if(hint)hint.innerHTML='<span onclick="exitEdit('+row+')" style="color:#FFD43B;cursor:pointer;font-weight:600">수정 완료 ✓</span>';
  ta.style.height='auto';ta.style.height=Math.max(220,ta.scrollHeight)+'px';
  ta.focus();
}

function exitEdit(row){
  var ta=document.getElementById('msgbox');if(!ta)return;
  MSG[row]=ta.value;
  apiPost('saveMessage',{row:row,text:ta.value});
  ta.blur();
  document.activeElement&&document.activeElement.blur();
  var div=document.createElement('div');
  div.className='msg-display';div.id='msgdiv';
  div.setAttribute('onclick','enterEdit('+row+')');
  div.textContent=ta.value;
  ta.parentNode.replaceChild(div,ta);
  var hint=document.querySelector('.msg-edit-hint');
  if(hint)hint.innerHTML='탭하여 수정';
}

function nav(dir){
  var cur=S[CI];
  if(!DONE.has(cur.row)){var b=document.getElementById('msgbox');if(b){MSG[cur.row]=b.value;apiPost('saveMessage',{row:cur.row,text:b.value})}}
  var gl=S.filter(function(x){return MSG[x.row]});
  var p=gl.findIndex(function(x){return x.row===cur.row})+dir;
  if(p>=0&&p<gl.length){CI=S.findIndex(function(x){return x.row===gl[p].row});rDet(dir>0)}
}

function doCopy(row){
  var b=document.getElementById('msgbox'),m=b?b.value:MSG[row];MSG[row]=m;
  try{navigator.clipboard.writeText(m)}catch(e){}
  if(!DONE.has(row)){
    DONE.add(row);SHORT[row]=false;
    apiPost('markDone',{row:row,text:m}).catch(function(e){DONE.delete(row)});
  }
  var gl=S.filter(function(x){return MSG[x.row]});
  var p=gl.findIndex(function(x){return x.row===row});
  var nextPending=gl.slice(p+1).find(function(x){return!DONE.has(x.row)});
  if(nextPending){CI=S.findIndex(function(x){return x.row===nextPending.row});rDet(true)}
  else{T('모든 메시지 복사 완료!');setTimeout(function(){rInput()},1200)}
}

function doRegen(row){
  var s=S.find(function(x){return x.row===row}),kw=KW[row]||'';
  if(!kw.trim()){T('키워드를 입력해주세요');return}
  REGEN.add(row);rDet(false);
  genKakao(s,kw).then(function(r){
    REGEN.delete(row);
    var m=r.text;SHORT[row]=r.short;
    MSG[row]=m;apiPost('saveMessage',{row:row,text:m});
    if(VIEW==='detail'&&S[CI].row===row)rDet(false);
  }).catch(function(e){REGEN.delete(row);T('실패: '+e.message);rDet(false)});
}

function undo(row){
  DONE.delete(row);rDet(false);
  apiPost('undoDone',{row:row}).catch(function(e){DONE.add(row);rDet(false)});
}

// ═══ 수납 현황표 (종이 양식) ═══
// 기본은 전월·이번 달 두 칸. 월 제목(또는 "6개월 보기")을 누르면 6개월로 펼쳐진다.
// 칸을 누르면 납부일·메모 창이 뜨고, 저장을 눌러야 기록된다. 이름 줄을 누르면 원생 정보 수정.
var LDG={y:new Date().getFullYear(),m:new Date().getMonth()+1,wide:false,Y:{},at:{},busy:{},rows:[],saving:{},lastDate:'',err:''};
var RET=[]; // 퇴원 원생 (복원용)
var LDG_METHODS=['카드','현금','앱','현영','계좌'];

function ldgCacheKey(y){return 'sori_ldg2_'+(IS_TEST?'t':'m')+'_'+y}
function ldgReadCache(y){try{var v=localStorage.getItem(ldgCacheKey(y));return v?JSON.parse(v):null}catch(e){return null}}
function ldgWriteCache(y){try{if(LDG.Y[y])localStorage.setItem(ldgCacheKey(y),JSON.stringify(LDG.Y[y]))}catch(e){}}
function ldgToday(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function ldgShortDate(s){var m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s||'');return m?(+m[2])+'/'+(+m[3]):esc(s||'')}
function ldgFee(s){var t=String(s||'').trim();if(/^[\d,]+$/.test(t)){var n=parseInt(t.replace(/,/g,''),10);return isNaN(n)?t:n.toLocaleString()}return t}
function ldgFreq(f){f=String(f||'').trim();return /^\d+$/.test(f)?'주'+f+'회':f}
function ldgPrev(y,m){return m>1?{y:y,m:m-1}:{y:y-1,m:12}}
function ldgNext(y,m){return m<12?{y:y,m:m+1}:{y:y+1,m:1}}
// 화면에 보이는 달들 (왼쪽이 옛날). 맨 오른쪽이 LDG.y/LDG.m
function ldgCols(){var n=LDG.wide?6:2,a=[],c={y:LDG.y,m:LDG.m};for(var k=0;k<n;k++){a.unshift(c);c=ldgPrev(c.y,c.m)}return a}
function ldgYears(){var a=[];ldgCols().forEach(function(c){if(a.indexOf(c.y)<0)a.push(c.y)});return a}
function ldgStu(y,name){var d=LDG.Y[y];if(!d)return null;for(var i=0;i<d.students.length;i++)if(d.students[i].name===name)return d.students[i];return null}
function ldgCell(y,m,name){var s=ldgStu(y,name);return s?s.months[m]:null}
function ldgKey(name,y,m){return name+'|'+y+'|'+m}

function switchTab(t){
  if(t==='ledger'){if(VIEW!=='ledger')ldgOpen()}
  else if(VIEW!=='input')rInput();
}

function ldgOpen(){setView('ledger');ldgLoad()}

// 폰에 저장된 표를 먼저 보여주고, 뒤에서 최신 내용을 받아 바꾼다 (1년치 = 요청 1번)
function ldgLoad(force){
  var ys=ldgYears();
  ys.forEach(function(y){if(!LDG.Y[y]){var c=ldgReadCache(y);if(c&&c.students)LDG.Y[y]=c}});
  LDG.err='';
  ldgRender();
  ys.forEach(function(y){
    if(LDG.busy[y])return;
    if(!force&&LDG.at[y]&&Date.now()-LDG.at[y]<60000)return;
    LDG.busy[y]=true;
    apiGet('loadPaymentYear',{year:y}).then(function(d){
      LDG.busy[y]=false;LDG.at[y]=Date.now();
      ldgKeepSaving(y,d);
      LDG.Y[y]=d;ldgWriteCache(y);
      if(VIEW==='ledger')ldgRender();
    }).catch(function(e){
      LDG.busy[y]=false;
      if(VIEW!=='ledger')return;
      if(!LDG.Y[y]){LDG.err=e.message;ldgRender()}
      else T('최신 내용을 못 불러왔어요');
    });
  });
}
// 저장 중인 칸은 방금 받은 내용 대신 화면 값을 유지
function ldgKeepSaving(y,d){
  Object.keys(LDG.saving).forEach(function(k){
    var v=LDG.saving[k];if(v.y!==y)return;
    var o=ldgStu(y,v.name),n=null;
    d.students.forEach(function(s){if(s.name===v.name)n=s});
    if(!o||!n)return;
    if(o.months[v.m])n.months[v.m]=o.months[v.m];else delete n.months[v.m];
  });
}

function ldgShift(d){
  for(var k=0,n=LDG.wide?6:1;k<n;k++){var c=d<0?ldgPrev(LDG.y,LDG.m):ldgNext(LDG.y,LDG.m);LDG.y=c.y;LDG.m=c.m}
  ldgLoad();
}
function ldgGoNow(){var n=new Date();LDG.y=n.getFullYear();LDG.m=n.getMonth()+1;ldgLoad()}
function ldgToggleWide(){LDG.wide=!LDG.wide;ldgLoad()}

function ldgHeadHtml(){
  var c=ldgCols(),a=c[0],now=new Date(),isNow=LDG.y===now.getFullYear()&&LDG.m===now.getMonth()+1;
  var title=LDG.wide?(a.y!==LDG.y?a.y+'년 '+a.m+'월~'+LDG.m+'월':LDG.y+'년 '+a.m+'~'+LDG.m+'월'):LDG.y+'년 '+LDG.m+'월';
  return '<div class="ldg-head"><div><div class="ldg-kicker">수납 현황표</div><div class="ldg-title'+(LDG.wide?' sm':'')+'">'+title+'</div></div>'+
    '<div class="det-nav"><button type="button" class="nav-b" aria-label="이전" onclick="ldgShift(-1)">'+ICON_PREV+'</button>'+
    '<button type="button" class="nav-b" aria-label="다음" onclick="ldgShift(1)">'+ICON_NEXT+'</button></div></div>'+
    '<div class="ldg-tools"><button type="button" class="chip" onclick="ldgToggleWide()">'+(LDG.wide?'2개월 보기':'6개월 보기')+'</button>'+
    (isNow?'':'<button type="button" class="chip" onclick="ldgGoNow()">이번 달로</button>')+'</div>';
}

function ldgSummaryHtml(rows){
  var paid=0,sum=0,total=0;
  rows.forEach(function(s){
    if(s.retired)return;total++;
    var c=ldgCell(LDG.y,LDG.m,s.name);if(c&&c.paid){paid++;sum+=Number(s.fee)||0}
  });
  return '<div class="bar ldg-sum"><span class="bar-info">'+LDG.m+'월 수납 <b>'+paid+'</b>/'+total+'명 · <b>₩'+sum.toLocaleString()+'</b>'+
    (total-paid>0?' · 미납 <b class="b-o">'+(total-paid)+'</b>명':'')+'</span></div>';
}

// 보이는 해들의 원생을 합친 줄 목록 (최근 해 순서 우선)
function ldgRows(){
  var seen={},rows=[];
  ldgYears().reverse().forEach(function(y){
    var d=LDG.Y[y];if(!d)return;
    d.students.forEach(function(s){if(!seen[s.name]){seen[s.name]=1;rows.push(s)}});
  });
  return rows;
}

function ldgCellHtml(i,c,isCur){
  var s=LDG.rows[i],v=ldgCell(c.y,c.m,s.name);
  var cls='c-m'+(isCur?' c-cur':'')+(LDG.saving[ldgKey(s.name,c.y,c.m)]?' c-saving':'');
  var inner='';
  if(v&&v.paid)inner='<span class="ck">✓</span><span class="dt">'+ldgShortDate(v.date)+'</span>';
  if(v&&v.memo)inner+='<span class="memo">'+esc(String(v.memo))+'</span>';
  return '<td class="'+cls+'" onclick="ldgEdit('+i+','+c.y+','+c.m+')">'+inner+'</td>';
}

function ldgRender(){
  var cols=ldgCols(),now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1,h=ldgHeadHtml();
  if(!ldgYears().every(function(y){return LDG.Y[y]})){
    Q('app',h+(LDG.err?'<div class="bar"><span class="bar-info">불러오기 실패: '+esc(LDG.err)+'</span><button class="btn btn-d" onclick="ldgLoad(true)">다시 시도</button></div>'
      :'<div class="loading"><div class="spin"></div>수납 현황 불러오는 중...</div>'));
    return;
  }
  var rows=LDG.rows=ldgRows();
  h+=ldgSummaryHtml(rows);
  h+='<div class="ldg-hint">칸을 누르면 납부일·메모 입력 · 이름을 누르면 원생 정보 수정</div>';
  h+='<div class="ldg-wrap" id="ldgWrap"><table class="ldg'+(LDG.wide?' wide':'')+'"><thead><tr><th class="c-nm">이름</th>'+
    (LDG.wide?'':'<th class="c-fee">수강료</th><th class="c-lv">레벨·횟수</th>');
  cols.forEach(function(c){h+='<th class="c-mh'+(c.y===cy&&c.m===cm?' c-cur':'')+'" onclick="ldgToggleWide()">'+c.m+'월</th>'});
  h+='</tr></thead><tbody>';
  rows.forEach(function(s,i){
    h+='<tr'+(s.retired?' class="r-ret"':'')+'><td class="c-nm" onclick="ldgStuEdit('+i+')"><span class="no">'+(i+1)+'</span><span class="nm">'+esc(String(s.name))+'</span>'+
      '<span class="pm">'+(s.retired?'퇴원':esc(String(s.method||'')))+'</span></td>';
    if(!LDG.wide)h+='<td class="c-fee" onclick="ldgStuEdit('+i+')">'+esc(ldgFee(s.feeDisplay))+'</td>'+
      '<td class="c-lv" onclick="ldgStuEdit('+i+')">'+esc([s.level,ldgFreq(s.freq)].filter(Boolean).join(' '))+'</td>';
    cols.forEach(function(c){h+=ldgCellHtml(i,c,c.y===cy&&c.m===cm)});
    h+='</tr>';
  });
  if(!rows.length)h+='<tr><td class="c-empty" colspan="'+(cols.length+(LDG.wide?1:3))+'">원생이 없어요</td></tr>';
  h+='</tbody></table></div>';
  h+='<div class="ldg-foot"><button type="button" class="btn btn-d" onclick="ldgStuEdit(-1)">+ 원생 추가</button>'+
    (RET.length?'<button type="button" class="btn btn-d" onclick="ldgShowRetired()">퇴원 원생 '+RET.length+'명</button>':'')+'</div>';
  var st=window.scrollY;Q('app',h);window.scrollTo(0,st);
}

// ── 칸: 납부일·메모 ──
// 납부일은 직전에 저장한 날짜로 열린다 (같은 날 낸 사람들을 연달아 적기 편하게). 앱을 새로 켜면 오늘.
function ldgEdit(i,y,m){
  var s=LDG.rows[i];if(!s||LDG.saving[ldgKey(s.name,y,m)])return;
  var c=ldgCell(y,m,s.name)||{},paid=!!c.paid,a='('+i+','+y+','+m+',';
  showModal('<div class="modal-title">'+esc(String(s.name))+' · '+m+'월</div>'+
    '<label class="fld"><span>납부일</span><input type="date" id="edDate" value="'+esc(c.date||LDG.lastDate||ldgToday())+'"></label>'+
    '<label class="fld"><span>메모</span><input type="text" id="edMemo" maxlength="40" placeholder="예: 11만 주2회" value="'+esc(String(c.memo||''))+'"></label>'+
    '<div class="modal-btns">'+
    (paid?'<button class="btn btn-d" onclick="ldgSaveFromEditor'+a+'false)">납부 취소</button><button class="btn btn-y" onclick="ldgSaveFromEditor'+a+'true)">저장</button>'
         :'<button class="btn btn-d" onclick="ldgSaveFromEditor'+a+'false)">메모만 저장</button><button class="btn btn-y" onclick="ldgSaveFromEditor'+a+'true)">납부 저장</button>')+
    '</div>');
}
function ldgSaveFromEditor(i,y,m,paid){
  var s=LDG.rows[i];
  var d=(document.getElementById('edDate')||{}).value||ldgToday();
  var memo=(document.getElementById('edMemo')||{}).value||'';
  closeModal();
  if(s)ldgSave(s.name,y,m,paid,d,memo);
}

function ldgSave(name,y,m,paid,date,memo){
  var key=ldgKey(name,y,m);
  if(LDG.saving[key]||!LDG.Y[y])return;
  var s=ldgStu(y,name);
  if(!s){
    // 그 해 표에 없는 원생(다른 해에서 온 줄)이면 줄을 만들어 둔다
    var src=null;LDG.rows.forEach(function(r){if(r.name===name)src=r});
    s={name:name,fee:src?src.fee:0,feeDisplay:src?src.feeDisplay:'',level:src?src.level:'',freq:src?src.freq:'',method:src?src.method:'',retired:!!(src&&src.retired),months:{}};
    LDG.Y[y].students.push(s);
  }
  var prev=s.months[m]?JSON.parse(JSON.stringify(s.months[m])):null;
  var next={paid:!!paid,date:paid?(date||ldgToday()):'',memo:String(memo||'').trim()};
  if(!next.paid&&!next.memo){if(!prev)return;delete s.months[m]}else s.months[m]=next;
  if(next.paid)LDG.lastDate=next.date;
  LDG.saving[key]={name:name,y:y,m:m};ldgRender();
  apiPost('savePaymentCell',{year:y,month:m,name:name,paid:next.paid,date:next.date,memo:next.memo}).then(function(){
    delete LDG.saving[key];ldgWriteCache(y);
    if(VIEW==='ledger')ldgRender();
  }).catch(function(e){
    delete LDG.saving[key];
    var s2=ldgStu(y,name);
    if(s2){if(prev)s2.months[m]=prev;else delete s2.months[m]}
    if(VIEW==='ledger')ldgRender();
    T('저장 실패: '+e.message);
  });
}

// ── 원생 정보: 추가(i=-1) / 수정 / 퇴원 / 복원 ──
function stuInfo(name){for(var i=0;i<S.length;i++)if(S[i].name===name)return S[i];return null}
function stuAdopt(s){if(s.kw)KW[s.row]=s.kw;PrevKW[s.row]=s.prevKw||'';if(s.msg)MSG[s.row]=s.msg;if(s.done)DONE.add(s.row)}
function stuFeeNum(t){var n=parseInt(String(t||'').replace(/,/g,''),10);return isNaN(n)?0:n}

function ldgStuEdit(i){
  var s=i>=0?LDG.rows[i]:null,info=s?stuInfo(s.name):null;
  if(i>=0&&!s)return;
  function f(label,id,val,ph,mode){
    return '<label class="fld"><span>'+label+'</span><input type="'+(mode==='tel'?'tel':'text')+'" id="'+id+'" maxlength="40" value="'+esc(String(val==null?'':val))+'" placeholder="'+esc(ph||'')+'"'+(mode?' inputmode="'+mode+'"':'')+'></label>';
  }
  var h='<div class="modal-title">'+(s?'원생 정보 수정':'원생 추가')+'</div>'+
    f('이름','stName',s?s.name:'','')+
    '<div class="fld-row">'+f('수강료','stFee',s?ldgFee(s.feeDisplay):'','140,000')+f('결제수단','stMethod',s?s.method:'','카드')+'</div>'+
    '<div class="chips">'+LDG_METHODS.map(function(x){return '<button type="button" onclick="document.getElementById(\'stMethod\').value=\''+x+'\'">'+x+'</button>'}).join('')+'</div>'+
    '<div class="fld-row">'+f('레벨','stLevel',s?s.level:'','기초')+f('주 횟수','stFreq',s?s.freq:'','2')+'</div>';
  // 학년·성별·연락처는 메시지 쪽 정보. 퇴원 원생은 이 정보가 없어서 건드리지 않는다
  if(!s||info)h+='<div class="fld-row">'+f('학년','stGrade',info?info.grade:'','초3')+f('성별','stGender',info?info.gender:'','여')+'</div>'+
    '<div class="fld-row">'+f('학부모명','stParent',info?info.parentName:'','')+f('연락처','stPhone',info?info.phone:'','010-0000-0000','tel')+'</div>';
  h+='<div class="modal-btns"><button class="btn btn-d" onclick="closeModal()">닫기</button><button class="btn btn-y" id="stSave" onclick="ldgStuSave('+i+')">저장</button></div>';
  if(s)h+=s.retired?'<button class="btn btn-d pick-clear" onclick="ldgSetRetired('+i+',false)">다시 다니는 원생으로 복원</button>'
                   :'<button class="btn btn-d pick-clear" onclick="ldgAskRetire('+i+')">퇴원 처리</button>';
  showModal(h);
}

function ldgStuSave(i){
  function g(id){var el=document.getElementById(id);return el?el.value.trim():undefined}
  var s=i>=0?LDG.rows[i]:null,name=g('stName');
  if(!name){T('이름을 적어주세요');return}
  var body={name:name,fee:g('stFee'),method:g('stMethod'),level:g('stLevel'),freq:g('stFreq'),grade:g('stGrade'),gender:g('stGender'),parentName:g('stParent'),phone:g('stPhone')};
  var info=s?stuInfo(s.name):null,orig=s?s.name:'';
  var btn=document.getElementById('stSave');if(btn){btn.disabled=true;btn.textContent='저장 중...'}
  if(s){body.origName=orig;if(info)body.row=info.row}
  apiPost(s?'studentUpdate':'studentAdd',body).then(function(r){
    closeModal();
    if(s){
      if(info){
        info.name=name;info.fee=body.fee;info.level=body.level;info.freq=body.freq;info.method=body.method;
        if(body.grade!==undefined){info.grade=body.grade;info.gender=body.gender;info.gg=[body.grade,body.gender].filter(Boolean).join(' ');info.parentName=body.parentName;info.phone=body.phone}
      }
      RET.forEach(function(x){if(x.name===orig)x.name=name});
      Object.keys(LDG.Y).forEach(function(y){
        var o=ldgStu(y,orig);if(!o)return;
        o.name=name;o.feeDisplay=body.fee;o.fee=stuFeeNum(body.fee);o.level=body.level;o.freq=body.freq;o.method=body.method;
        ldgWriteCache(y);
      });
      T(name+' 정보를 저장했어요');
    }else{
      var n={row:r.row,name:name,grade:body.grade||'',gender:body.gender||'',gg:[body.grade,body.gender].filter(Boolean).join(' '),
        kw:'',prevKw:'',msg:'',hist:'',done:false,phone:body.phone||'',parentName:body.parentName||'',level:body.level||'',freq:body.freq||'',fee:body.fee||'',method:body.method||'',retired:false};
      S.push(n);stuAdopt(n);
      Object.keys(LDG.Y).forEach(function(y){
        LDG.Y[y].students.push({name:name,fee:stuFeeNum(body.fee),feeDisplay:body.fee||'',level:body.level||'',freq:body.freq||'',method:body.method||'',retired:false,months:{}});
      });
      T(name+' 원생을 추가했어요');
    }
    if(VIEW==='ledger')ldgLoad(true);
  }).catch(function(e){
    if(btn){btn.disabled=false;btn.textContent='저장'}
    T('저장 실패: '+e.message);
  });
}

function ldgAskRetire(i){
  var s=LDG.rows[i];if(!s)return;
  showModal('<div class="modal-title">'+esc(String(s.name))+' 퇴원 처리</div>'+
    '<div class="modal-desc">메시지 목록과 수납 현황에서 숨겨요.<br>기록은 지워지지 않고, 언제든 복원할 수 있어요.</div>'+
    '<div class="modal-btns"><button class="btn btn-d" onclick="closeModal()">취소</button><button class="btn btn-y" onclick="ldgSetRetired('+i+',true)">퇴원 처리</button></div>');
}
function ldgSetRetired(i,retired){var s=LDG.rows[i];closeModal();if(s)stuSetRetired(s.name,retired)}
function ldgRestore(j){var s=RET[j];closeModal();if(s)stuSetRetired(s.name,false)}
function stuSetRetired(name,retired){
  apiPost('studentSetStatus',{name:name,retired:retired}).then(function(){
    var from=retired?S:RET,to=retired?RET:S;
    for(var k=from.length-1;k>=0;k--){
      if(from[k].name===name){var x=from.splice(k,1)[0];x.retired=retired;to.push(x);if(!retired)stuAdopt(x)}
    }
    S.sort(function(a,b){return a.row-b.row});
    Object.keys(LDG.Y).forEach(function(y){var o=ldgStu(y,name);if(o)o.retired=retired});
    T(name+(retired?' 퇴원 처리했어요':' 복원했어요'));
    if(VIEW==='ledger')ldgLoad(true);
  }).catch(function(e){T('저장 실패: '+e.message)});
}
function ldgShowRetired(){
  showModal('<div class="modal-title">퇴원 원생</div><div class="ret-list">'+
    RET.map(function(s,j){return '<div class="ret-row"><span>'+esc(String(s.name))+'</span><button class="btn btn-d" onclick="ldgRestore('+j+')">복원</button></div>'}).join('')+
    '</div><div class="modal-btns"><button class="btn btn-d" onclick="closeModal()">닫기</button></div>');
}

// ═══ Android Back Button ═══
function handleBack(){
  // 투토리얼 열려있으면 닫기
  if(document.getElementById('tut').classList.contains('on')){closeTutorial();return true}
  // 모달 열려있으면 닫기
  if(document.getElementById('modal').classList.contains('on')){closeModal();return true}
  var ta=document.getElementById('msgbox');
  if(ta){exitEdit(S[CI].row);return true}
  if(VIEW==='detail'){goBackFromDet();return true}
  if(VIEW==='ledger'){if(LDG.wide)ldgToggleWide();else rInput();return true}
  if(VIEW==='list'){rInput();return true}
  // 메인화면 → false 리턴 → MainActivity에서 종료 팝업
  return false;
}

// ═══ 화면 왼쪽 끝에서 오른쪽으로 밀면 뒤로가기 ═══
(function(){
  var sx=0,sy=0,fromEdge=false;
  document.addEventListener('touchstart',function(e){
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;fromEdge=sx<28;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!fromEdge)return;fromEdge=false;
    if(VIEW==='input'||VIEW==='ledger')return;
    if(document.getElementById('tut').classList.contains('on'))return;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);
    if(dx>70&&dy<60)handleBack();
  },{passive:true});
})();

init();
</script>
